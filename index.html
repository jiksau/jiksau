<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Special Extra Course</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles to override or extend Tailwind */
        body {
            font-family: 'Inter', sans-serif; /* Using Inter font */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); /* More vibrant gradient */
            color: white;
            overflow-x: hidden;
            padding: 24px 0; /* Ruang atas-bawah agar formulir bisa digulir di HP */
            box-sizing: border-box;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            letter-spacing: 1.5px;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            color: #fff; /* Ensure heading is white */
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            color: #1a202c; /* Darker color for section titles */
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .container {
            background: rgba(255, 255, 255, 0.15); /* Semi-transparent white background */
            backdrop-filter: blur(15px); /* Stronger frosted glass effect */
            border: 1px solid rgba(255, 255, 255, 0.3); /* Subtle border */
            color: #1a202c; /* Dark text for contrast on light background */
            width: 90%;
            max-width: 450px; /* Slightly wider container */
            border-radius: 20px; /* More rounded corners */
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4); /* Deeper shadow */
            padding: 40px; /* More padding */
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: fadeIn 1s ease-out; /* Add a fade-in animation */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tabs {
            display: flex;
            justify-content: space-around;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3); /* Lighter border for tabs */
            margin-bottom: 30px;
        }

        .tabs button {
            background: transparent;
            border: none;
            padding: 12px 20px; /* More padding for tabs */
            font-size: 1.1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7); /* Lighter color for inactive tabs */
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .tabs button.active {
            color: #fff; /* White for active tab */
            border-bottom: 3px solid #fff; /* Stronger active indicator */
            transform: translateY(-2px); /* Slight lift for active tab */
        }

        .tabs button:hover:not(.active) {
            color: #e0f2fe; /* Light blue on hover for inactive */
            transform: translateY(-2px);
        }

        .form-group {
            display: none;
            margin-bottom: 20px;
        }

        .form-group.active {
            display: block;
        }

        /* Input field styling */
        .input-wrapper {
            position: relative;
            margin-bottom: 15px; /* Space for error message */
        }

        .input-wrapper input {
            box-sizing: border-box; /* Lebar termasuk padding agar tidak meluber */
            width: 100%;
            height: 48px;
            padding: 12px 15px;
            font-size: 1rem;
            border: 1px solid #cbd5e0;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.8);
            color: #2d3748;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.2);
            background-color: #fff;
        }

        .error-message {
            color: #fef08a; /* Kuning muda: terbaca jelas di latar ungu */
            font-weight: 600;
            font-size: 0.85rem;
            text-align: left;
            margin-top: 5px;
            height: 18px; /* Reserve space to prevent layout shift */
            display: block;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        .error-message.active {
            opacity: 1;
        }

        /* Show password toggle */
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 0;
            height: 48px; /* Sejajar dengan kolom password */
            display: flex;
            align-items: center;
            cursor: pointer;
            color: #4a5568; /* Tailwind gray-700 */
            font-size: 1.2rem;
            transition: color 0.2s;
        }

        .input-wrapper input[type="password"],
        .input-wrapper input#signup-password,
        .input-wrapper input#signup-confirm-password,
        .input-wrapper input#signin-password {
            padding-right: 44px; /* Ruang untuk ikon mata */
        }

        .password-toggle:hover {
            color: #2d3748; /* Tailwind gray-900 */
        }


        .form-group button {
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            border: none;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 114, 255, 0.4);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .form-group button:hover:not(:disabled) { /* Only hover if not disabled */
            background: linear-gradient(45deg, #0072ff, #00c6ff);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 114, 255, 0.6);
        }

        .form-group button:active:not(:disabled) { /* Only active if not disabled */
            transform: translateY(0);
            box-shadow: 0 3px 10px rgba(0, 114, 255, 0.3);
        }

        .form-group button:disabled {
            background: #a0aec0; /* Tailwind gray-400 */
            cursor: not-allowed;
            box-shadow: none;
        }


        #status {
            margin-top: 25px;
            font-size: 1rem;
            font-weight: 500;
            color: #2d3748;
        }

        a {
            color: #007bff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        a:hover {
            color: #0056b3;
            text-decoration: underline;
        }
        
        /* Admin button specific style */
        #admin-dashboard-button {
            background-color: #4CAF50; /* Green */
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            margin-top: 20px;
            transition: background-color 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        #admin-dashboard-button:hover {
            background-color: #45a049;
        }


        .input-wrapper label {
            display: block;
            text-align: left;
            font-size: 0.85rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }
        .field-hint {
            display: block;
            text-align: left;
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.85);
            margin-top: 4px;
        }
        .input-wrapper input.code-input {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }
        .code-ok {
            color: #bbf7d0;
            font-weight: 600;
        }
        #status {
            min-height: 1.5em;
        }
        #status.error { color: #fee2e2; }
        #status.ok { color: #dcfce7; }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
                margin-bottom: 20px;
            }
            h2 {
                font-size: 1.5rem;
                margin-bottom: 20px;
            }
            .container {
                padding: 24px 18px;
                border-radius: 15px;
            }
            .tabs button {
                padding: 10px 15px;
                font-size: 1rem;
            }
            .input-wrapper input {
                padding: 10px 12px;
                font-size: 1rem; /* 16px mencegah iPhone memperbesar layar saat mengetik */
            }
            .form-group button {
                padding: 12px;
                font-size: 1rem;
            }
        }
    </style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            sendPasswordResetEmail,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import {
            getFirestore,
            doc,
            getDoc,
            setDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
        import {
            firebaseConfig, ADMIN_EMAIL, levelLabel, loginIdToEmail, isUsernameEmail,
            normalizeClassCode, CLASS_CODE_PATTERN, friendlyAuthError
        } from "./ec-common.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Mencegah pengalihan otomatis saat proses daftar masih berjalan
        let isSigningUp = false;

        document.addEventListener("DOMContentLoaded", () => {
            const $ = (id) => document.getElementById(id);
            const signupButton = $("signup-button");
            const signinButton = $("signin-button");
            const signupTab = $("signup-tab");
            const signinTab = $("signin-tab");
            const signupForm = $("signup-form");
            const signinForm = $("signin-form");
            const statusDiv = $("status");

            const signupName = $("signup-name");
            const signupEmail = $("signup-email");
            const signupPassword = $("signup-password");
            const signupConfirm = $("signup-confirm-password");
            const signupCode = $("signup-code");
            const signinId = $("signin-id");
            const signinPassword = $("signin-password");

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            function setStatus(text, type = "") {
                statusDiv.textContent = text;
                statusDiv.className = type;
            }

            // --- Cek status login ---
            onAuthStateChanged(auth, (user) => {
                if (user && !isSigningUp) {
                    window.location.href = user.email === ADMIN_EMAIL ? "admin.html" : "user-dashboard.html";
                }
            });

            // --- Pindah tab ---
            function showTab(which) {
                const isSignup = which === "signup";
                signupForm.classList.toggle("active", isSignup);
                signinForm.classList.toggle("active", !isSignup);
                signupTab.classList.toggle("active", isSignup);
                signinTab.classList.toggle("active", !isSignup);
                setStatus("");
                isSignup ? validateSignupForm(false) : validateSigninForm(false);
            }
            signupTab.addEventListener("click", () => showTab("signup"));
            signinTab.addEventListener("click", () => showTab("signin"));

            // --- Validasi ---
            function showError(id, message, show) {
                const el = $(id);
                el.textContent = show ? message : "";
                el.classList.toggle("active", Boolean(show && message));
            }

            function validateSignupForm(showMessages = true) {
                const checks = [
                    ["signup-name-error", signupName, signupName.value.trim() !== "", "Nama wajib diisi."],
                    ["signup-email-error", signupEmail, emailRegex.test(signupEmail.value.trim()), "Masukkan email yang valid."],
                    ["signup-password-error", signupPassword, signupPassword.value.length >= 6, "Minimal 6 karakter."],
                    ["signup-confirm-password-error", signupConfirm, signupConfirm.value === signupPassword.value && signupConfirm.value !== "", "Password tidak sama."],
                    ["signup-code-error", signupCode, CLASS_CODE_PATTERN.test(normalizeClassCode(signupCode.value)), "Kode kelas 4–12 huruf/angka, minta ke guru."],
                ];
                let ok = true;
                checks.forEach(([id, field, valid, msg]) => {
                    const touched = showMessages && field.dataset.touched === "1";
                    showError(id, msg, !valid && touched);
                    if (!valid) ok = false;
                });
                signupButton.disabled = !ok;
                return ok;
            }

            function validateSigninForm(showMessages = true) {
                const idOk = signinId.value.trim() !== "";
                const pwOk = signinPassword.value.length > 0;
                showError("signin-id-error", "Isi email atau nama pengguna.", !idOk && showMessages && signinId.dataset.touched === "1");
                showError("signin-password-error", "Password wajib diisi.", !pwOk && showMessages && signinPassword.dataset.touched === "1");
                signinButton.disabled = !(idOk && pwOk);
                return idOk && pwOk;
            }

            [signupName, signupEmail, signupPassword, signupConfirm, signupCode].forEach((el) => {
                el.addEventListener("input", () => { el.dataset.touched = "1"; validateSignupForm(); });
            });
            [signinId, signinPassword].forEach((el) => {
                el.addEventListener("input", () => { el.dataset.touched = "1"; validateSigninForm(); });
            });

            // --- Tombol lihat password ---
            [["signup-password", "signup-password-toggle"], ["signup-confirm-password", "signup-confirm-password-toggle"], ["signin-password", "signin-password-toggle"]]
                .forEach(([inputId, toggleId]) => {
                    $(toggleId).addEventListener("click", () => {
                        const input = $(inputId);
                        input.type = input.type === "password" ? "text" : "password";
                        $(toggleId).textContent = input.type === "password" ? "👁️" : "🚫";
                    });
                });

            // --- Daftar ---
            signupButton.addEventListener("click", async () => {
                [signupName, signupEmail, signupPassword, signupConfirm, signupCode].forEach((el) => el.dataset.touched = "1");
                if (!validateSignupForm()) {
                    setStatus("Periksa kembali isian yang masih salah.", "error");
                    return;
                }
                const code = normalizeClassCode(signupCode.value);
                signupButton.disabled = true;
                setStatus("Memeriksa kode kelas...");

                // 1) Pastikan kode kelas ada & aktif SEBELUM membuat akun
                let codeData;
                try {
                    const snap = await getDoc(doc(db, "classCodes", code));
                    if (!snap.exists() || snap.data().active !== true) {
                        showError("signup-code-error", "Kode kelas tidak ditemukan atau sudah tidak aktif.", true);
                        setStatus("Kode kelas tidak valid. Tanyakan kode yang benar ke guru.", "error");
                        signupButton.disabled = false;
                        return;
                    }
                    codeData = snap.data();
                } catch (e) {
                    console.error(e);
                    setStatus("Gagal memeriksa kode kelas. Coba lagi.", "error");
                    signupButton.disabled = false;
                    return;
                }

                // 2) Buat akun lalu profil siswa
                setStatus("Membuat akun...");
                isSigningUp = true;
                let user = null;
                try {
                    const cred = await createUserWithEmailAndPassword(auth, signupEmail.value.trim(), signupPassword.value);
                    user = cred.user;
                    await setDoc(doc(db, "users", user.uid), {
                        name: signupName.value.trim(),
                        role: "Student",
                        email: user.email,
                        level: codeData.level,
                        classCode: code,
                        loginType: "email",
                        createdAt: serverTimestamp(),
                    });
                    setStatus(`Berhasil! Selamat datang di jenjang ${levelLabel(codeData.level)} 🎉`, "ok");
                    setTimeout(() => { window.location.href = "user-dashboard.html"; }, 1500);
                } catch (error) {
                    console.error("Sign up error:", error);
                    // Profil gagal dibuat: hapus lagi akunnya agar bisa daftar ulang
                    if (user) { try { await user.delete(); } catch (_) { /* abaikan */ } }
                    isSigningUp = false;
                    setStatus(friendlyAuthError(error), "error");
                    signupButton.disabled = false;
                }
            });

            // --- Masuk ---
            signinButton.addEventListener("click", async () => {
                [signinId, signinPassword].forEach((el) => el.dataset.touched = "1");
                if (!validateSigninForm()) return;
                signinButton.disabled = true;
                setStatus("Masuk...");
                try {
                    const cred = await signInWithEmailAndPassword(auth, loginIdToEmail(signinId.value), signinPassword.value);
                    setStatus("Berhasil masuk!", "ok");
                    // Pengalihan dilakukan oleh onAuthStateChanged
                    if (cred.user.email === ADMIN_EMAIL) window.location.href = "admin.html";
                } catch (error) {
                    console.error("Sign in error:", error);
                    setStatus(friendlyAuthError(error), "error");
                    signinButton.disabled = false;
                }
            });

            // --- Lupa password ---
            $("forgot-password").addEventListener("click", async (e) => {
                e.preventDefault();
                const id = signinId.value.trim();
                if (!id) {
                    setStatus("Isi email Anda di kolom atas dulu, lalu klik Lupa Password.", "error");
                    return;
                }
                const email = loginIdToEmail(id);
                if (isUsernameEmail(email)) {
                    setStatus("Akun dengan nama pengguna tidak punya email. Minta guru/admin untuk mengatur ulang password.", "error");
                    return;
                }
                try {
                    await sendPasswordResetEmail(auth, email);
                    setStatus(`Link atur ulang password sudah dikirim ke ${email}. Cek kotak masuk/spam.`, "ok");
                } catch (error) {
                    setStatus(friendlyAuthError(error), "error");
                }
            });

            $("admin-dashboard-button").addEventListener("click", () => {
                window.location.href = "admin-login.html";
            });

            showTab("signin");
        });
    </script>
</head>
<body>
    <div class="container">
        <h1>Special Extra Course</h1>
        <div class="tabs">
            <button id="signin-tab" type="button">Masuk</button>
            <button id="signup-tab" type="button">Daftar</button>
        </div>
        <div id="signin-form" class="form-group">
            <h2>Masuk</h2>
            <div class="input-wrapper">
                <input type="text" id="signin-id" placeholder="Email atau nama pengguna" autocomplete="username" autocapitalize="none" required>
                <span id="signin-id-error" class="error-message"></span>
            </div>
            <div class="input-wrapper">
                <input type="password" id="signin-password" placeholder="Password" autocomplete="current-password" required>
                <span id="signin-password-toggle" class="password-toggle">👁️</span>
                <span id="signin-password-error" class="error-message"></span>
            </div>
            <button id="signin-button" type="button">Masuk</button>
            <p style="text-align: center; margin-top: 15px;">
                <a href="#" id="forgot-password" style="color:#fff">Lupa password?</a>
            </p>
        </div>
        <div id="signup-form" class="form-group">
            <h2>Daftar Akun Permainan</h2>
            <div class="input-wrapper">
                <input type="text" id="signup-name" placeholder="Nama lengkap" autocomplete="name" required>
                <span id="signup-name-error" class="error-message"></span>
            </div>
            <div class="input-wrapper">
                <input type="email" id="signup-email" placeholder="Email" autocomplete="email" autocapitalize="none" required>
                <span id="signup-email-error" class="error-message"></span>
            </div>
            <div class="input-wrapper">
                <input type="password" id="signup-password" placeholder="Password (min. 6 karakter)" autocomplete="new-password" required>
                <span id="signup-password-toggle" class="password-toggle">👁️</span>
                <span id="signup-password-error" class="error-message"></span>
            </div>
            <div class="input-wrapper">
                <input type="password" id="signup-confirm-password" placeholder="Ulangi password" autocomplete="new-password" required>
                <span id="signup-confirm-password-toggle" class="password-toggle">👁️</span>
                <span id="signup-confirm-password-error" class="error-message"></span>
            </div>
            <div class="input-wrapper">
                <input type="text" id="signup-code" class="code-input" placeholder="KODE KELAS" maxlength="12" autocapitalize="characters" autocomplete="off" required>
                <span id="signup-code-error" class="error-message"></span>
                <span id="signup-code-info" class="field-hint">Kode kelas diberikan oleh guru ExtraCourse.</span>
            </div>
            <button id="signup-button" type="button">Daftar</button>
            <p class="field-hint" style="text-align:center;margin-top:12px">Tidak punya email? Minta guru membuatkan akun dengan nama pengguna.</p>
        </div>
        <div id="status"></div>
        <button id="admin-dashboard-button" type="button">Masuk sebagai Admin</button>
    </div>
</body>
</html>
