<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Special ExtraCourse</title>
    <link rel="stylesheet" href="game-ui.css">
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; }
        .auth { flex: 1; width: 100%; max-width: 420px; margin: 0 auto; padding: 40px 16px 24px; display: grid; gap: 16px; align-content: start; }
        .auth-head { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
        .auth-head .logo { width: 46px; height: 46px; border-radius: 13px; font-size: 17px; }
        .auth-head h1 { margin: 0; font-size: 21px; line-height: 1.2; letter-spacing: -0.3px; }
        .auth-head p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
        .tabs-seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--soft); border-radius: var(--radius-sm); }
        .tabs-seg button { height: 40px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 600; font-size: 14.5px; cursor: pointer; }
        .tabs-seg button.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(23,32,28,.12); }
        .form-group { display: none; gap: 12px; }
        .form-group.active { display: grid; }
        .form-group h2 { margin: 0 0 2px; font-size: 16px; }
        .input-wrapper { position: relative; display: grid; gap: 4px; }
        .input-wrapper .input { height: 48px; }
        .input-wrapper.pw .input { padding-right: 48px; }
        .password-toggle {
            position: absolute; top: 4px; right: 4px; width: 40px; height: 40px; border: 0; border-radius: 10px;
            background: none; color: var(--muted); display: grid; place-items: center; cursor: pointer;
        }
        .password-toggle:hover { background: var(--soft); }
        .code-input { text-transform: uppercase; letter-spacing: 2px; font-weight: 700; }
        .code-input::placeholder { letter-spacing: 0; font-weight: 400; text-transform: none; }
        .error-message { display: none; color: var(--bad); font-size: 13px; padding-left: 2px; }
        .error-message.active { display: block; }
        .field-hint { color: var(--muted); font-size: 12.5px; padding-left: 2px; margin: 0; }
        .link { background: none; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; padding: 6px; justify-self: center; font-size: 14px; text-decoration: none; }
        #status { font-size: 14px; padding: 10px 14px; border-radius: var(--radius-sm); background: var(--soft); color: var(--muted); }
        #status:empty { display: none; }
        #status.ok { background: var(--ok-soft); color: var(--ok); }
        #status.error { background: var(--bad-soft); color: var(--bad); }
        .admin-link { justify-self: center; background: none; border: 0; color: var(--muted); font-size: 13px; cursor: pointer; padding: 8px; }
        .admin-link:hover { color: var(--text); }
    </style>
</head>
<body>
    <main class="auth">
        <div class="auth-head">
            <span class="logo">EC</span>
            <div><h1>Special ExtraCourse</h1><p>Belajar sambil bermain</p></div>
        </div>

        <div class="card" style="display:grid;gap:16px">
            <div class="tabs-seg">
                <button id="signin-tab" type="button">Masuk</button>
                <button id="signup-tab" type="button">Daftar</button>
            </div>

            <div id="signin-form" class="form-group">
                <div class="input-wrapper">
                    <input type="text" id="signin-id" class="input" placeholder="Email atau nama pengguna" autocomplete="username" autocapitalize="none" required>
                    <span id="signin-id-error" class="error-message"></span>
                </div>
                <div class="input-wrapper pw">
                    <input type="password" id="signin-password" class="input" placeholder="Password" autocomplete="current-password" required>
                    <button type="button" id="signin-password-toggle" class="password-toggle" aria-label="Lihat password"><svg class="ico" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
                    <span id="signin-password-error" class="error-message"></span>
                </div>
                <button id="signin-button" class="btn block" type="button">Masuk</button>
                <a href="#" id="forgot-password" class="link">Lupa password?</a>
            </div>

            <div id="signup-form" class="form-group">
                <h2>Daftar akun permainan</h2>
                <div class="input-wrapper">
                    <input type="text" id="signup-name" class="input" placeholder="Nama lengkap" autocomplete="name" required>
                    <span id="signup-name-error" class="error-message"></span>
                </div>
                <div class="input-wrapper">
                    <input type="email" id="signup-email" class="input" placeholder="Email" autocomplete="email" autocapitalize="none" required>
                    <span id="signup-email-error" class="error-message"></span>
                </div>
                <div class="input-wrapper pw">
                    <input type="password" id="signup-password" class="input" placeholder="Password (min. 6 karakter)" autocomplete="new-password" required>
                    <button type="button" id="signup-password-toggle" class="password-toggle" aria-label="Lihat password"><svg class="ico" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
                    <span id="signup-password-error" class="error-message"></span>
                </div>
                <div class="input-wrapper pw">
                    <input type="password" id="signup-confirm-password" class="input" placeholder="Ulangi password" autocomplete="new-password" required>
                    <button type="button" id="signup-confirm-password-toggle" class="password-toggle" aria-label="Lihat password"><svg class="ico" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
                    <span id="signup-confirm-password-error" class="error-message"></span>
                </div>
                <div class="input-wrapper">
                    <input type="text" id="signup-code" class="input code-input" placeholder="Kode kelas" maxlength="12" autocapitalize="characters" autocomplete="off" required>
                    <span id="signup-code-error" class="error-message"></span>
                    <span id="signup-code-info" class="field-hint">Kode kelas diberikan oleh guru ExtraCourse.</span>
                </div>
                <button id="signup-button" class="btn block" type="button">Daftar</button>
                <p class="field-hint" style="text-align:center">Tidak punya email? Minta guru membuatkan akun dengan nama pengguna.</p>
            </div>

            <div id="status"></div>
        </div>

        <button id="admin-dashboard-button" class="admin-link" type="button">Masuk sebagai admin</button>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            sendPasswordResetEmail,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import {
            getFirestore,
            doc,
            getDoc,
            setDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
        import {
            firebaseConfig, ADMIN_EMAIL, levelLabel, loginIdToEmail, isUsernameEmail,
            normalizeClassCode, CLASS_CODE_PATTERN, friendlyAuthError
        } from "./ec-common.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Mencegah pengalihan otomatis saat proses daftar masih berjalan
        let isSigningUp = false;

        document.addEventListener("DOMContentLoaded", () => {
            const $ = (id) => document.getElementById(id);
            const signupButton = $("signup-button");
            const signinButton = $("signin-button");
            const signupTab = $("signup-tab");
            const signinTab = $("signin-tab");
            const signupForm = $("signup-form");
            const signinForm = $("signin-form");
            const statusDiv = $("status");

            const signupName = $("signup-name");
            const signupEmail = $("signup-email");
            const signupPassword = $("signup-password");
            const signupConfirm = $("signup-confirm-password");
            const signupCode = $("signup-code");
            const signinId = $("signin-id");
            const signinPassword = $("signin-password");

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            function setStatus(text, type = "") {
                statusDiv.textContent = text;
                statusDiv.className = type;
            }

            // --- Cek status login ---
            onAuthStateChanged(auth, (user) => {
                if (user && !isSigningUp) {
                    window.location.href = user.email === ADMIN_EMAIL ? "admin.html" : "user-dashboard.html";
                }
            });

            // --- Pindah tab ---
            function showTab(which) {
                const isSignup = which === "signup";
                signupForm.classList.toggle("active", isSignup);
                signinForm.classList.toggle("active", !isSignup);
                signupTab.classList.toggle("active", isSignup);
                signinTab.classList.toggle("active", !isSignup);
                setStatus("");
                isSignup ? validateSignupForm(false) : validateSigninForm(false);
            }
            signupTab.addEventListener("click", () => showTab("signup"));
            signinTab.addEventListener("click", () => showTab("signin"));

            // --- Validasi ---
            function showError(id, message, show) {
                const el = $(id);
                el.textContent = show ? message : "";
                el.classList.toggle("active", Boolean(show && message));
            }

            function validateSignupForm(showMessages = true) {
                const checks = [
                    ["signup-name-error", signupName, signupName.value.trim() !== "", "Nama wajib diisi."],
                    ["signup-email-error", signupEmail, emailRegex.test(signupEmail.value.trim()), "Masukkan email yang valid."],
                    ["signup-password-error", signupPassword, signupPassword.value.length >= 6, "Minimal 6 karakter."],
                    ["signup-confirm-password-error", signupConfirm, signupConfirm.value === signupPassword.value && signupConfirm.value !== "", "Password tidak sama."],
                    ["signup-code-error", signupCode, CLASS_CODE_PATTERN.test(normalizeClassCode(signupCode.value)), "Kode kelas 4–12 huruf/angka, minta ke guru."],
                ];
                let ok = true;
                checks.forEach(([id, field, valid, msg]) => {
                    const touched = showMessages && field.dataset.touched === "1";
                    showError(id, msg, !valid && touched);
                    if (!valid) ok = false;
                });
                signupButton.disabled = !ok;
                return ok;
            }

            function validateSigninForm(showMessages = true) {
                const idOk = signinId.value.trim() !== "";
                const pwOk = signinPassword.value.length > 0;
                showError("signin-id-error", "Isi email atau nama pengguna.", !idOk && showMessages && signinId.dataset.touched === "1");
                showError("signin-password-error", "Password wajib diisi.", !pwOk && showMessages && signinPassword.dataset.touched === "1");
                signinButton.disabled = !(idOk && pwOk);
                return idOk && pwOk;
            }

            [signupName, signupEmail, signupPassword, signupConfirm, signupCode].forEach((el) => {
                el.addEventListener("input", () => { el.dataset.touched = "1"; validateSignupForm(); });
            });
            [signinId, signinPassword].forEach((el) => {
                el.addEventListener("input", () => { el.dataset.touched = "1"; validateSigninForm(); });
            });

            // --- Tombol lihat password ---
            const EYE = '<svg class="ico" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
            const EYE_OFF = '<svg class="ico" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7c1.8 0 3.3-.5 4.6-1.2"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
            [["signup-password", "signup-password-toggle"], ["signup-confirm-password", "signup-confirm-password-toggle"], ["signin-password", "signin-password-toggle"]]
                .forEach(([inputId, toggleId]) => {
                    $(toggleId).addEventListener("click", () => {
                        const input = $(inputId);
                        input.type = input.type === "password" ? "text" : "password";
                        $(toggleId).innerHTML = input.type === "password" ? EYE : EYE_OFF;
                        $(toggleId).setAttribute("aria-label", input.type === "password" ? "Lihat password" : "Sembunyikan password");
                    });
                });

            // --- Daftar ---
            signupButton.addEventListener("click", async () => {
                [signupName, signupEmail, signupPassword, signupConfirm, signupCode].forEach((el) => el.dataset.touched = "1");
                if (!validateSignupForm()) {
                    setStatus("Periksa kembali isian yang masih salah.", "error");
                    return;
                }
                const code = normalizeClassCode(signupCode.value);
                signupButton.disabled = true;
                setStatus("Memeriksa kode kelas...");

                // 1) Pastikan kode kelas ada & aktif SEBELUM membuat akun
                let codeData;
                try {
                    const snap = await getDoc(doc(db, "classCodes", code));
                    if (!snap.exists() || snap.data().active !== true) {
                        showError("signup-code-error", "Kode kelas tidak ditemukan atau sudah tidak aktif.", true);
                        setStatus("Kode kelas tidak valid. Tanyakan kode yang benar ke guru.", "error");
                        signupButton.disabled = false;
                        return;
                    }
                    codeData = snap.data();
                } catch (e) {
                    console.error(e);
                    setStatus("Gagal memeriksa kode kelas. Coba lagi.", "error");
                    signupButton.disabled = false;
                    return;
                }

                // 2) Buat akun lalu profil siswa
                setStatus("Membuat akun...");
                isSigningUp = true;
                let user = null;
                try {
                    const cred = await createUserWithEmailAndPassword(auth, signupEmail.value.trim(), signupPassword.value);
                    user = cred.user;
                    await setDoc(doc(db, "users", user.uid), {
                        name: signupName.value.trim(),
                        role: "Student",
                        email: user.email,
                        level: codeData.level,
                        classCode: code,
                        loginType: "email",
                        createdAt: serverTimestamp(),
                    });
                    setStatus(`Berhasil! Selamat datang di jenjang ${levelLabel(codeData.level)}.`, "ok");
                    setTimeout(() => { window.location.href = "user-dashboard.html"; }, 1500);
                } catch (error) {
                    console.error("Sign up error:", error);
                    // Profil gagal dibuat: hapus lagi akunnya agar bisa daftar ulang
                    if (user) { try { await user.delete(); } catch (_) { /* abaikan */ } }
                    isSigningUp = false;
                    setStatus(friendlyAuthError(error), "error");
                    signupButton.disabled = false;
                }
            });

            // --- Masuk ---
            signinButton.addEventListener("click", async () => {
                [signinId, signinPassword].forEach((el) => el.dataset.touched = "1");
                if (!validateSigninForm()) return;
                signinButton.disabled = true;
                setStatus("Masuk...");
                try {
                    const cred = await signInWithEmailAndPassword(auth, loginIdToEmail(signinId.value), signinPassword.value);
                    setStatus("Berhasil masuk!", "ok");
                    // Pengalihan dilakukan oleh onAuthStateChanged
                    if (cred.user.email === ADMIN_EMAIL) window.location.href = "admin.html";
                } catch (error) {
                    console.error("Sign in error:", error);
                    setStatus(friendlyAuthError(error), "error");
                    signinButton.disabled = false;
                }
            });

            // --- Lupa password ---
            $("forgot-password").addEventListener("click", async (e) => {
                e.preventDefault();
                const id = signinId.value.trim();
                if (!id) {
                    setStatus("Isi email Anda di kolom atas dulu, lalu klik Lupa Password.", "error");
                    return;
                }
                const email = loginIdToEmail(id);
                if (isUsernameEmail(email)) {
                    setStatus("Akun dengan nama pengguna tidak punya email. Minta guru/admin untuk mengatur ulang password.", "error");
                    return;
                }
                try {
                    await sendPasswordResetEmail(auth, email);
                    setStatus(`Link atur ulang password sudah dikirim ke ${email}. Cek kotak masuk/spam.`, "ok");
                } catch (error) {
                    setStatus(friendlyAuthError(error), "error");
                }
            });

            $("admin-dashboard-button").addEventListener("click", () => {
                window.location.href = "admin-login.html";
            });

            showTab("signin");
        });
    </script>
</body>
</html>
