<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papan Peringkat - ExtraCourse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --purple: #6a11cb;
            --blue: #2575fc;
            --ink: #1f2937;
            --muted: #6b7280;
            --line: #e5e7eb;
            --gold: #f59e0b;
            --silver: #94a3b8;
            --bronze: #c2703d;
            --me: #fef3c7;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--purple) 0%, var(--blue) 100%);
            background-attachment: fixed;
            color: var(--ink);
            visibility: hidden; /* Tampil setelah login terverifikasi */
        }
        header.top {
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 720px;
            margin: 0 auto;
            padding: 16px 16px 4px;
            color: #fff;
        }
        header.top a {
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            background: rgba(255,255,255,.18);
            padding: 8px 12px;
            border-radius: 999px;
            white-space: nowrap;
        }
        header.top h1 { margin: 0; font-size: 1.35rem; font-weight: 800; }
        main {
            max-width: 720px;
            margin: 12px auto 32px;
            padding: 20px 16px 24px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,.2);
        }
        @media (min-width: 760px) { main { padding: 24px 28px 28px; } }

        .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
        .seg { display: inline-flex; background: #f3f4f6; border-radius: 999px; padding: 4px; }
        .seg button {
            border: none; background: transparent; font: inherit; font-weight: 600; font-size: .9rem;
            padding: 8px 16px; border-radius: 999px; cursor: pointer; color: var(--muted);
        }
        .seg button.active { background: #fff; color: var(--purple); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
        .seg[hidden] { display: none; }
        .tag { display: inline-block; font-size: .7rem; font-weight: 700; color: var(--purple); background: #ede9fe; border-radius: 999px; padding: 1px 8px; margin-left: 4px; vertical-align: middle; }
        #levelSelect { font: inherit; font-weight: 600; padding: 8px 12px; border-radius: 10px; border: 1px solid #d1d5db; color: var(--purple); }
        .meta { color: var(--muted); font-size: .85rem; margin: 12px 0 16px; line-height: 1.5; }

        .my-rank {
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 18px;
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            color: #78350f;
            display: flex; align-items: center; gap: 14px;
        }
        .my-rank .big { font-size: 1.9rem; font-weight: 800; line-height: 1; min-width: 56px; text-align: center; }
        .my-rank .txt { font-size: .9rem; line-height: 1.45; }
        .my-rank .txt b { font-size: 1rem; }
        .my-rank a { color: #92400e; font-weight: 700; }
        .my-rank.empty { background: #eef2ff; color: #3730a3; display: block; }
        .my-rank.empty a { color: #4338ca; }

        /* Podium */
        .podium { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; align-items: end; margin: 8px 0 18px; }
        .pod { text-align: center; }
        .pod .medal { font-size: 1.8rem; line-height: 1; }
        .pod .name { font-weight: 700; font-size: .92rem; margin: 6px 0 2px; overflow-wrap: anywhere; }
        .pod .pts { font-size: .8rem; color: var(--muted); margin-bottom: 6px; }
        .pod .block { border-radius: 12px 12px 0 0; color: #fff; font-weight: 800; font-size: 1.4rem; display: flex; align-items: flex-start; justify-content: center; padding-top: 8px; }
        .pod.p1 .block { height: 92px; }
        .pod.p2 .block { height: 68px; }
        .pod.p3 .block { height: 52px; }
        .pod .block.r1 { background: linear-gradient(180deg, #fbbf24, #f59e0b); }
        .pod .block.r2 { background: linear-gradient(180deg, #cbd5e1, #94a3b8); }
        .pod .block.r3 { background: linear-gradient(180deg, #e7a578, #c2703d); }
        .pod.me .name::after { content: " (kamu)"; color: var(--purple); font-weight: 600; font-size: .75rem; }
        .pod.blank { visibility: hidden; }

        /* Daftar */
        .list { list-style: none; margin: 0; padding: 0; }
        .row {
            display: grid;
            grid-template-columns: 40px 1fr auto;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 12px;
        }
        .row:nth-child(odd) { background: #f9fafb; }
        .row .rank { font-weight: 800; color: var(--muted); text-align: center; }
        .row .who { font-weight: 600; overflow-wrap: anywhere; }
        .row .who small { display: block; font-weight: 400; color: var(--muted); font-size: .75rem; }
        .row .pts { font-weight: 800; color: var(--purple); white-space: nowrap; }
        .row.me { background: var(--me) !important; outline: 2px solid #fbbf24; }
        .gap { text-align: center; color: var(--muted); letter-spacing: 4px; padding: 2px 0; }
        .empty-state { text-align: center; color: var(--muted); padding: 28px 8px; }

        .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
        .btn {
            flex: 1 1 200px;
            border: none; border-radius: 12px; padding: 12px 16px;
            font: inherit; font-weight: 700; font-size: .95rem; cursor: pointer;
            background: linear-gradient(135deg, var(--purple), var(--blue)); color: #fff;
            text-decoration: none; text-align: center;
        }
        .btn.secondary { background: #f3f4f6; color: var(--ink); }
        .btn:disabled { opacity: .6; cursor: wait; }

        /* ---------- Kartu siap dibagikan (1080x1350, ditampilkan 540x675) ---------- */
        .overlay {
            position: fixed; inset: 0; z-index: 50;
            background: rgba(17, 24, 39, .94);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 14px; padding: 16px;
        }
        .overlay[hidden] { display: none; }
        .poster-frame { position: relative; flex-shrink: 0; }
        .poster-frame > .poster { transform-origin: top left; position: absolute; top: 0; left: 0; }
        .overlay .share-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: 100%; max-width: 540px; }
        .overlay .share-actions .btn { flex: 1 1 140px; }
        .overlay .hint { color: #d1d5db; font-size: .8rem; text-align: center; margin: 0; }

        .poster {
            width: 540px; height: 675px;
            padding: 34px 34px 26px;
            display: flex; flex-direction: column;
            background:
                radial-gradient(circle at 85% 8%, rgba(255,255,255,.18) 0 70px, transparent 71px),
                radial-gradient(circle at 8% 92%, rgba(255,255,255,.12) 0 90px, transparent 91px),
                linear-gradient(150deg, #6a11cb 0%, #4f46e5 50%, #2575fc 100%);
            color: #fff;
            font-family: 'Poppins', system-ui, sans-serif;
            border-radius: 0;
            overflow: hidden;
        }
        .poster .brand { font-size: 13px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; opacity: .85; }
        .poster .title { font-size: 34px; font-weight: 800; line-height: 1.1; margin: 6px 0 4px; }
        .poster .sub { font-size: 15px; font-weight: 500; opacity: .9; }
        .poster .sub b { background: rgba(255,255,255,.22); padding: 2px 10px; border-radius: 999px; margin-right: 6px; }
        .poster .ppodium { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; align-items: end; margin: 22px 0 14px; }
        .poster .ppod { text-align: center; }
        .poster .ppod .m { font-size: 30px; line-height: 1; }
        .poster .ppod .n { font-size: 16px; font-weight: 700; margin: 6px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .poster .ppod .p { font-size: 13px; opacity: .9; margin-bottom: 6px; }
        .poster .ppod .b { border-radius: 14px 14px 0 0; display: flex; justify-content: center; padding-top: 8px; font-size: 26px; font-weight: 800; color: rgba(255,255,255,.95); }
        .poster .ppod.p1 .b { height: 104px; }
        .poster .ppod.p2 .b { height: 76px; }
        .poster .ppod.p3 .b { height: 58px; }
        .poster .ppod .b.r1 { background: linear-gradient(180deg, #fcd34d, #f59e0b); }
        .poster .ppod .b.r2 { background: linear-gradient(180deg, #e2e8f0, #94a3b8); }
        .poster .ppod .b.r3 { background: linear-gradient(180deg, #f0b48b, #c2703d); }
        .poster .ppod.blank { visibility: hidden; }
        .poster .plist { background: rgba(255,255,255,.14); border-radius: 16px; padding: 8px 14px; flex: 1; display: flex; flex-direction: column; justify-content: flex-start; }
        .poster .prow { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; font-size: 15px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.14); }
        .poster .prow:last-child { border-bottom: none; }
        .poster .prow .r { font-weight: 800; opacity: .85; }
        .poster .prow .n { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 8px; }
        .poster .prow .p { font-weight: 700; }
        .poster .prow .lv { font-size: 11px; font-weight: 700; background: rgba(255,255,255,.22); border-radius: 999px; padding: 1px 8px; margin-left: 6px; }
        .poster .ppod .lv { font-size: 11px; font-weight: 700; opacity: .9; }
        .poster .pempty { margin: auto; text-align: center; font-size: 16px; opacity: .9; }
        .poster .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; font-size: 12px; opacity: .9; }
        .poster .foot b { font-size: 14px; }
    </style>
</head>
<body>
    <header class="top">
        <a id="backLink" href="user-dashboard.html">← Kembali</a>
        <h1>Papan Peringkat</h1>
    </header>

    <main>
        <div class="controls">
            <div class="seg" id="weekSeg" role="tablist">
                <button data-week="this" class="active" role="tab">Minggu Ini</button>
                <button data-week="last" role="tab">Minggu Lalu</button>
            </div>
            <div class="seg" id="scopeSeg" role="tablist" hidden>
                <button data-scope="all" class="active" role="tab">Semua Jenjang</button>
                <button data-scope="level" role="tab" id="scopeLevelBtn">Jenjangku</button>
            </div>
            <select id="levelSelect" hidden aria-label="Pilih papan peringkat"></select>
        </div>
        <p class="meta" id="meta">Memuat...</p>

        <div id="myRank"></div>
        <div id="podium" class="podium"></div>
        <ol id="list" class="list"></ol>

        <div class="actions">
            <button class="btn" id="shareBtn" type="button">Tampilan untuk dibagikan</button>
            <a class="btn secondary" href="gamelist.html">Main game</a>
        </div>
    </main>

    <!-- Kartu siap dibagikan -->
    <div class="overlay" id="shareOverlay" hidden>
        <div class="poster-frame" id="posterFrame">
            <div class="poster" id="poster"></div>
        </div>
        <p class="hint">Bisa langsung di-screenshot, atau unduh sebagai gambar (1080×1350).</p>
        <div class="share-actions">
            <button class="btn" id="downloadBtn" type="button">Unduh gambar</button>
            <button class="btn secondary" id="closeShare" type="button">Tutup</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
        import {
            firebaseConfig, ADMIN_EMAIL, LEVELS, levelLabel, escapeHtml,
            weekKeyFor, previousWeekKey, weekEndMs, weekRangeLabel, shortName
        } from "./ec-common.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const $ = (id) => document.getElementById(id);

        const TOP_N = 10;
        // scope: 'all' = semua jenjang, 'level' = jenjang sendiri (siswa).
        // boardLevel: null = semua jenjang, atau kode jenjang (mis. 'SMP').
        const state = { uid: null, isAdmin: false, level: null, scope: 'all', boardLevel: null, week: 'this', ranking: [] };
        const pref = {
            get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
            set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* abaikan */ } },
        };
        const weekKey = () => state.week === 'this' ? weekKeyFor() : previousWeekKey(weekKeyFor());

        // ---------- Login ----------
        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'index.html'; return; }
            if (state.uid) return;
            state.uid = user.uid;
            state.isAdmin = user.email === ADMIN_EMAIL;

            if (state.isAdmin) {
                $('backLink').href = 'admin.html';
                $('levelSelect').innerHTML = '<option value="ALL">Semua jenjang</option>'
                    + LEVELS.map((l) => `<option value="${l.value}">Jenjang ${l.label}</option>`).join('');
                const saved = pref.get('lbBoard');
                state.boardLevel = LEVELS.some((l) => l.value === saved) ? saved : null;
                $('levelSelect').value = state.boardLevel || 'ALL';
                $('levelSelect').hidden = false;
            } else {
                try {
                    const snap = await getDoc(doc(db, 'users', user.uid));
                    if (!snap.exists()) { window.location.href = 'user-dashboard.html'; return; }
                    state.level = snap.data().level || null;
                } catch (e) {
                    console.error(e);
                }
                $('scopeLevelBtn').textContent = state.level ? `Jenjang ${levelLabel(state.level)}` : 'Jenjangku';
                state.scope = pref.get('lbScope') === 'level' && state.level ? 'level' : 'all';
                setScope(state.scope);
                $('scopeSeg').hidden = false;
            }
            document.body.style.visibility = 'visible';
            load();
        });

        // ---------- Kontrol ----------
        document.querySelectorAll('#weekSeg button').forEach((b) => b.addEventListener('click', () => {
            document.querySelectorAll('#weekSeg button').forEach((x) => x.classList.toggle('active', x === b));
            state.week = b.dataset.week;
            load();
        }));
        function setScope(scope) {
            state.scope = scope;
            state.boardLevel = scope === 'level' ? state.level : null;
            document.querySelectorAll('#scopeSeg button').forEach((x) => x.classList.toggle('active', x.dataset.scope === scope));
        }
        document.querySelectorAll('#scopeSeg button').forEach((b) => b.addEventListener('click', () => {
            setScope(b.dataset.scope);
            pref.set('lbScope', b.dataset.scope);
            load();
        }));
        $('levelSelect').addEventListener('change', (e) => {
            state.boardLevel = e.target.value === 'ALL' ? null : e.target.value;
            pref.set('lbBoard', e.target.value);
            load();
        });
        const boardLabel = () => state.boardLevel ? `Jenjang ${levelLabel(state.boardLevel)}` : 'Semua Jenjang';

        // ---------- Data ----------
        function buildRanking(docs) {
            const by = {};
            docs.forEach((d) => {
                const s = d.data();
                const r = by[s.userId] ||= { uid: s.userId, name: s.userName, level: s.level || null, points: 0, games: 0, last: 0 };
                r.points += Number(s.correct) || 0;
                r.games += 1;
                const t = s.timestamp?.toMillis?.() ?? 0;
                if (t >= r.last) { r.last = t; r.name = s.userName || r.name; r.level = s.level || r.level; }
            });
            const list = Object.values(by).filter((r) => r.points > 0)
                .sort((a, b) => b.points - a.points || b.games - a.games || shortName(a.name).localeCompare(shortName(b.name), 'id'));
            // Poin sama = peringkat sama (1, 2, 2, 4, ...)
            list.forEach((r, i) => { r.rank = i > 0 && r.points === list[i - 1].points ? list[i - 1].rank : i + 1; });
            return list;
        }

        async function load() {
            const key = weekKey();
            renderMeta(key);
            $('myRank').innerHTML = '';
            $('podium').innerHTML = '';
            if (!state.isAdmin && state.scope === 'level' && !state.level) {
                $('list').innerHTML = `<li class="empty-state">Jenjangmu belum diatur. Minta guru/admin mengatur jenjangmu, atau lihat papan Semua Jenjang.</li>`;
                state.ranking = [];
                return;
            }
            $('list').innerHTML = '<li class="empty-state">Memuat peringkat...</li>';
            try {
                const filters = state.boardLevel
                    ? [where('level', '==', state.boardLevel), where('week', '==', key)]
                    : [where('week', '==', key)];
                const snap = await getDocs(query(collection(db, 'gameScores'), ...filters));
                state.ranking = buildRanking(snap.docs);
                render();
            } catch (e) {
                console.error(e);
                $('list').innerHTML = `<li class="empty-state">Gagal memuat peringkat: ${escapeHtml(e.message)}</li>`;
            }
        }

        function renderMeta(key) {
            const parts = [weekRangeLabel(key)];
            if (state.week === 'this') {
                const ms = weekEndMs(key) - Date.now();
                const d = Math.floor(ms / 864e5), h = Math.floor((ms % 864e5) / 36e5), m = Math.floor((ms % 36e5) / 6e4);
                parts.push(`reset dalam ${d > 0 ? `${d} hari ${h} jam` : `${h} jam ${m} menit`}`);
            } else {
                parts.push('hasil akhir');
            }
            parts.push('1 jawaban benar = 1 poin');
            $('meta').textContent = parts.join(' · ');
        }

        // ---------- Tampilan ----------
        const medal = (rank) => ({ 1: '🥇', 2: '🥈', 3: '🥉' }[rank] || '');

        function render() {
            const list = state.ranking;
            const isThis = state.week === 'this';
            const me = list.find((r) => r.uid === state.uid);

            // Kartu posisi saya (khusus siswa)
            if (!state.isAdmin) {
                if (!me) {
                    $('myRank').innerHTML = `<div class="my-rank empty"><div class="txt">${isThis
                        ? '<b>Kamu belum punya poin minggu ini.</b><br>Selesaikan satu game untuk masuk papan peringkat. <a href="gamelist.html">Main sekarang →</a>'
                        : '<b>Kamu tidak bermain minggu lalu.</b><br>Ayo kejar peringkat di minggu ini.'}</div></div>`;
                } else {
                    let tip;
                    const above = list.filter((r) => r.points > me.points).pop();
                    if (!isThis) tip = me.rank === 1 ? 'Kamu juara minggu lalu. Selamat!' : `Peringkat akhirmu minggu lalu.`;
                    else if (me.rank === 1) tip = list.length > 1 ? 'Kamu juara sementara. Pertahankan!' : 'Kamu satu-satunya yang punya poin. Pertahankan!';
                    else if (me.rank > TOP_N) tip = `<b>${list[TOP_N - 1].points - me.points + 1} poin lagi</b> untuk masuk 10 besar!`;
                    else tip = `<b>${above.points - me.points + 1} poin lagi</b> untuk menyalip ${escapeHtml(shortName(above.name))}!`;
                    $('myRank').innerHTML = `<div class="my-rank"><div class="big">#${me.rank}</div><div class="txt"><b>${me.points} poin</b> · ${me.games} kali main · dari ${list.length} siswa (${state.boardLevel ? `jenjang ${escapeHtml(levelLabel(state.boardLevel))}` : 'semua jenjang'})<br>${tip}</div></div>`;
                }
            }

            if (list.length === 0) {
                $('podium').innerHTML = '';
                $('list').innerHTML = `<li class="empty-state">${isThis ? 'Belum ada poin minggu ini. Jadilah yang pertama!' : 'Tidak ada yang bermain minggu lalu di papan ini.'}</li>`;
                return;
            }

            // Podium: urutan tampil 2 - 1 - 3
            const top = list.slice(0, 3);
            const showLevel = !state.boardLevel;
            const lvTag = (r) => showLevel && r.level ? `<span class="tag">${escapeHtml(levelLabel(r.level))}</span>` : '';
            const pod = (r, cls) => r
                ? `<div class="pod ${cls}${r.uid === state.uid ? ' me' : ''}"><div class="medal">${medal(r.rank)}</div><div class="name">${escapeHtml(shortName(r.name))}</div><div class="pts">${r.points} poin${lvTag(r)}</div><div class="block r${Math.min(r.rank, 3)}">${r.rank}</div></div>`
                : `<div class="pod ${cls} blank"></div>`;
            $('podium').innerHTML = pod(top[1], 'p2') + pod(top[0], 'p1') + pod(top[2], 'p3');

            // Daftar peringkat 4-10 (+ posisi saya jika di luar 10 besar)
            const row = (r) => `<li class="row${r.uid === state.uid ? ' me' : ''}"><span class="rank">${medal(r.rank) || r.rank}</span><span class="who">${escapeHtml(shortName(r.name))}${r.uid === state.uid ? ' (kamu)' : ''}${lvTag(r)}<small>${r.games} kali main</small></span><span class="pts">${r.points} poin</span></li>`;
            let html = list.slice(3, TOP_N).map(row).join('');
            if (me && list.indexOf(me) >= TOP_N) html += `<li class="gap">• • •</li>${row(me)}`;
            $('list').innerHTML = html;
        }

        // ---------- Kartu siap dibagikan ----------
        function posterHtml() {
            const list = state.ranking;
            const isThis = state.week === 'this';
            const top = list.slice(0, 3);
            const p = (r, cls) => r
                ? `<div class="ppod ${cls}"><div class="m">${medal(r.rank)}</div><div class="n">${escapeHtml(shortName(r.name))}</div><div class="p">${r.points} poin${!state.boardLevel && r.level ? ` · <span class="lv">${escapeHtml(levelLabel(r.level))}</span>` : ''}</div><div class="b r${Math.min(r.rank, 3)}">${r.rank}</div></div>`
                : `<div class="ppod ${cls} blank"></div>`;
            const rest = list.slice(3, TOP_N).map((r) => `<div class="prow"><span class="r">${medal(r.rank) || r.rank}</span><span class="n">${escapeHtml(shortName(r.name))}${!state.boardLevel && r.level ? `<span class="lv">${escapeHtml(levelLabel(r.level))}</span>` : ''}</span><span class="p">${r.points} poin</span></div>`).join('');
            return `
                <div class="brand">ExtraCourse · Teman Belajar</div>
                <div class="title">${isThis ? 'Klasemen Sementara' : 'Juara Mingguan'}</div>
                <div class="sub"><b>${escapeHtml(boardLabel())}</b>${weekRangeLabel(weekKey())}</div>
                ${list.length ? `<div class="ppodium">${p(top[1], 'p2')}${p(top[0], 'p1')}${p(top[2], 'p3')}</div>` : ''}
                <div class="plist">${rest || (list.length ? `<div class="pempty">${isThis ? 'Masih ada waktu untuk masuk 10 besar!' : 'Selamat untuk para juara!'}</div>` : '<div class="pempty">Belum ada poin di minggu ini.<br>Siapa yang jadi juara pertama?</div>')}</div>
                <div class="foot"><span>1 jawaban benar = 1 poin</span><b>${isThis ? 'Ayo kejar peringkatmu!' : 'Selamat, para juara!'}</b></div>`;
        }

        function fitPoster() {
            const scale = Math.min(1, (window.innerWidth - 32) / 540, (window.innerHeight - 170) / 675);
            const frame = $('posterFrame');
            frame.style.width = `${540 * scale}px`;
            frame.style.height = `${675 * scale}px`;
            $('poster').style.transform = `scale(${scale})`;
        }

        $('shareBtn').addEventListener('click', () => {
            $('poster').innerHTML = posterHtml();
            $('shareOverlay').hidden = false;
            fitPoster();
        });
        $('closeShare').addEventListener('click', () => { $('shareOverlay').hidden = true; });
        window.addEventListener('resize', () => { if (!$('shareOverlay').hidden) fitPoster(); });

        // Render kartu ke gambar PNG 1080x1350 (salinan tanpa skala agar tajam)
        async function posterBlob() {
            if (!window.html2canvas) throw new Error('Pembuat gambar belum termuat. Coba lagi, atau screenshot saja.');
            const clone = $('poster').cloneNode(true);
            clone.removeAttribute('id');
            clone.style.cssText = 'position:fixed;left:-10000px;top:0;transform:none;';
            document.body.appendChild(clone);
            try {
                if (document.fonts?.ready) await document.fonts.ready;
                const canvas = await window.html2canvas(clone, { scale: 2, backgroundColor: null, useCORS: true, logging: false });
                return await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
            } finally {
                clone.remove();
            }
        }
        const fileName = () => `peringkat-${state.boardLevel || 'semua-jenjang'}-${weekKey()}.png`.toLowerCase();

        $('downloadBtn').addEventListener('click', async (e) => {
            e.target.disabled = true;
            try {
                const blob = await posterBlob();
                const url = URL.createObjectURL(blob);
                const a = Object.assign(document.createElement('a'), { href: url, download: fileName() });
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 5000);
            } catch (err) {
                alert(err.message);
            } finally {
                e.target.disabled = false;
            }
        });

    </script>
</body>
</html>
