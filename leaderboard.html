<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papan Peringkat - ExtraCourse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="game-ui.css">
    <style>
        body { visibility: hidden; } /* Tampil setelah login terverifikasi */

        .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--soft); border-radius: var(--radius-sm); padding: 4px; flex: 1 1 220px; }
        .seg button {
            border: 0; background: transparent; font-weight: 600; font-size: 14px;
            padding: 8px 12px; border-radius: 9px; cursor: pointer; color: var(--muted); white-space: nowrap;
        }
        .seg button.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(23,32,28,.12); }
        .seg[hidden] { display: none; }
        #levelSelect { flex: 1 1 200px; height: 46px; padding: 0 12px; border-radius: var(--radius-sm); border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; }
        .lb-tag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: middle; }
        /* Kartu minggu */
        .week { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 14px 12px 16px; }
        .wk-top { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; }
        .wk-col small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
        .wk-col b { display: block; font-size: 15.5px; font-variant-numeric: tabular-nums; }
        .wk-col.right { text-align: right; }
        .wk-col.right b { color: var(--accent); }
        .info { width: 32px; height: 32px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); display: grid; place-items: center; cursor: pointer; padding: 0; }
        .info .ico { width: 17px; height: 17px; }
        .info.on { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
        .wk-bar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 12px; }
        .wk-bar .day { display: grid; gap: 4px; justify-items: center; }
        .wk-bar .wseg { display: block; width: 100%; height: 6px; border-radius: 99px; background: var(--soft); overflow: hidden; }
        .wk-bar .wseg i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
        .wk-bar .dn { font-size: 10.5px; font-weight: 600; color: var(--muted); }
        .wk-bar .today .dn { color: var(--accent); font-weight: 700; }
        .rule { margin-top: 10px; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--soft); font-size: 13.5px; line-height: 1.5; animation: drop .18s ease-out; }
        @keyframes drop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

        /* Peringkatku */
        .my-rank { border-radius: var(--radius); padding: 16px 16px 14px 18px; background: var(--accent-soft); color: var(--text); }
        .my-rank .head { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
        .my-rank .big { font-size: 34px; font-weight: 700; line-height: 1; letter-spacing: -1px; color: var(--accent); font-variant-numeric: tabular-nums; }
        .my-rank .kicker { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
        .my-rank .pts { display: block; font-size: 19px; line-height: 1.3; color: var(--accent); }
        .my-rank .hint { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
        .my-rank.empty { background: var(--surface); border: 1px solid var(--line); }
        .my-rank.empty .pts { color: var(--text); }
        .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .pill { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 99px; background: var(--surface); font-size: 12px; font-weight: 600; color: var(--muted); }
        .chase { margin-top: 14px; padding-top: 12px; border-top: 1px solid color-mix(in srgb, var(--accent) 18%, transparent); font-size: 13.5px; }
        .chase.done { color: var(--accent); font-weight: 600; }
        .chase-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
        .chase-top b { color: var(--accent); }
        .chase .num { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .cbar { height: 8px; border-radius: 99px; background: var(--surface); margin-top: 8px; overflow: hidden; }
        .cbar i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
        #myRank:empty { display: none; }

        /* Podium */
        .podium { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; align-items: end; margin-top: 8px; }
        .podium:empty { display: none; }
        .pod { text-align: center; min-width: 0; }
        .pod .medal { font-size: 28px; line-height: 1; }
        .pod .name { font-weight: 700; font-size: 14.5px; margin: 6px 0 2px; overflow-wrap: anywhere; }
        .pod .lv { margin: 2px 0 2px; }
        .pod .lv .lb-tag { margin: 0; }
        .pod .pts { font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
        .pod .block { border-radius: 12px 12px 0 0; color: #fff; font-weight: 700; font-size: 22px; display: flex; align-items: flex-start; justify-content: center; padding-top: 8px; }
        .pod.p1 .block { height: 92px; }
        .pod.p2 .block { height: 68px; }
        .pod.p3 .block { height: 52px; }
        .pod .block.r1 { background: linear-gradient(180deg, #f2c94c, #d9a21b); }
        .pod .block.r2 { background: linear-gradient(180deg, #c9d2cd, #9aa6a0); }
        .pod .block.r3 { background: linear-gradient(180deg, #e3a67a, #c0763f); }
        .pod .name { letter-spacing: .02em; }
        .pod.me .name::after { content: " (kamu)"; color: var(--accent); font-weight: 600; font-size: 11px; letter-spacing: 0; }
        .pod.blank { visibility: hidden; }

        /* Daftar */
        #list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
        #list .row { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); }
        #list .row:first-child { border-top: 0; }
        #list:empty { display: none; }
        #list .rank { font-weight: 700; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
        #list .who { font-weight: 700; overflow-wrap: anywhere; min-width: 0; letter-spacing: .02em; }
        #list .who em { font-style: normal; font-weight: 600; font-size: 12px; color: var(--accent); letter-spacing: 0; }
        #list .who small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
        #list .pts { font-weight: 700; color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }
        #list .row.me { background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--accent); }
        #list .gap { text-align: center; color: var(--muted); letter-spacing: 4px; padding: 4px 0; border-top: 1px solid var(--line); }
        #list .empty-state { text-align: center; color: var(--muted); padding: 28px 12px; }

        /* ---------- Kartu siap dibagikan (1080x1350, ditampilkan 540x675) ---------- */
        .overlay {
            position: fixed; inset: 0; z-index: 50;
            background: rgba(10, 16, 13, .94);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 14px; padding: 16px;
        }
        .overlay[hidden] { display: none; }
        .poster-frame { position: relative; flex-shrink: 0; }
        .poster-frame > .poster { transform-origin: top left; position: absolute; top: 0; left: 0; }
        .overlay .share-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: 100%; max-width: 540px; }
        .overlay .share-actions .btn { flex: 1 1 140px; }
        .overlay .btn.secondary { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.2); color: #fff; }
        .overlay .hint { color: #c9d2cd; font-size: 13px; text-align: center; margin: 0; }

        /* Poster selalu berwarna sama (tidak ikut mode gelap) */
        .poster {
            width: 540px; height: 675px;
            padding: 34px 34px 26px;
            display: flex; flex-direction: column;
            background:
                radial-gradient(circle at 85% 8%, rgba(255,255,255,.14) 0 70px, transparent 71px),
                radial-gradient(circle at 8% 92%, rgba(255,255,255,.10) 0 90px, transparent 91px),
                linear-gradient(150deg, #14553a 0%, #1f6f4a 55%, #2e8a5f 100%);
            color: #fff;
            font-family: "Plus Jakarta Sans", system-ui, sans-serif;
            overflow: hidden;
        }
        .poster .ptop { display: flex; justify-content: space-between; align-items: center; font-size: 13px; line-height: 1.4; }
        .poster .ptop .brand { flex: none; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; opacity: .9; }
        .poster .ptop .date { font-weight: 600; opacity: .85; }
        .poster .kicker { margin-top: 18px; font-size: 13px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: #f6d36b; }
        .poster .title { font-size: 44px; font-weight: 800; line-height: 1.05; letter-spacing: -1px; margin: 4px 0 10px; }
        .poster .sub { font-size: 15px; font-weight: 500; opacity: .95; }
        .poster .sub b { background: rgba(255,255,255,.2); padding: 2px 10px; border-radius: 999px; margin-right: 6px; }
        .poster .ppodium { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; align-items: end; margin: 22px 0 14px; }
        .poster .ppod { text-align: center; min-width: 0; }
        .poster .ppod .m { font-size: 30px; line-height: 1; }
        .poster .ppod .n { font-size: 16px; font-weight: 700; margin: 6px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .poster .ppod .p { font-size: 13px; opacity: .9; margin-bottom: 6px; }
        .poster .ppod .b { border-radius: 14px 14px 0 0; display: flex; justify-content: center; padding-top: 8px; font-size: 26px; font-weight: 800; color: rgba(255,255,255,.95); }
        .poster .ppod.p1 .b { height: 104px; }
        .poster .ppod.p2 .b { height: 76px; }
        .poster .ppod.p3 .b { height: 58px; }
        .poster .ppod .b.r1 { background: linear-gradient(180deg, #f6d36b, #d9a21b); }
        .poster .ppod .b.r2 { background: linear-gradient(180deg, #e3e8e5, #a3aea8); }
        .poster .ppod .b.r3 { background: linear-gradient(180deg, #edb88f, #c0763f); }
        .poster .ppod.blank { visibility: hidden; }
        .poster .plist { background: rgba(255,255,255,.12); border-radius: 16px; padding: 8px 14px; flex: 1; display: flex; flex-direction: column; justify-content: flex-start; }
        .poster .prow { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; font-size: 15px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.12); }
        .poster .prow:last-child { border-bottom: none; }
        .poster .prow .r { font-weight: 800; opacity: .85; }
        .poster .prow .n { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 8px; }
        .poster .prow .p { font-weight: 700; }
        .poster .prow .lv { display: inline-block; min-width: 40px; text-align: center; font-size: 11px; font-weight: 700; background: rgba(255,255,255,.2); border-radius: 999px; padding: 1px 8px; margin-right: 8px; vertical-align: 1px; }
        .poster .prow .n, .poster .ppod .n { letter-spacing: .03em; }
        .poster .ppod .lv { font-size: 11px; font-weight: 700; opacity: .9; }
        .poster .pempty { margin: auto; text-align: center; font-size: 16px; opacity: .9; }
        .poster .foot { display: flex; justify-content: center; align-items: center; margin-top: 14px; font-size: 12px; opacity: .95; }
        .poster .foot b { font-size: 14px; }
    </style>
</head>
<body class="has-tabs">
    <header class="topbar">
        <div class="topbar-inner">
            <a id="backLink" href="admin.html" class="back" hidden><svg class="ico" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>Admin</a>
            <span class="logo" id="logoMark">EC</span>
            <div class="brand"><b>Peringkat</b><small>Juara setiap minggu</small></div>
            <span id="notif"></span>
        </div>
    </header>

    <main class="app">
        <div class="controls">
            <div class="seg" id="weekSeg" role="tablist">
                <button data-week="this" class="active" role="tab">Minggu Ini</button>
                <button data-week="last" role="tab">Minggu Lalu</button>
            </div>
            <div class="seg" id="scopeSeg" role="tablist" hidden>
                <button data-scope="all" class="active" role="tab">Semua Jenjang</button>
                <button data-scope="level" role="tab" id="scopeLevelBtn">Jenjangku</button>
            </div>
            <select id="levelSelect" hidden aria-label="Pilih papan peringkat"></select>
        </div>
        <div class="week">
            <div class="wk-top">
                <div class="wk-col"><small id="weekLbl">Minggu ini</small><b id="weekRange">-</b></div>
                <div class="wk-col right"><small id="leftLbl">Reset dalam</small><b id="weekLeft">-</b></div>
                <button type="button" class="info" id="ruleBtn" aria-label="Cara menghitung poin" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
            </div>
            <div class="wk-bar" id="weekBar"></div>
            <div class="rule" id="rule" hidden>1 jawaban benar = 1 poin, hanya dari paket soal guru. Jika satu paket dimainkan berkali-kali, yang dihitung hasil terbaiknya.</div>
        </div>

        <div id="myRank"></div>
        <div id="podium" class="podium"></div>
        <ol id="list"></ol>

        <div class="actions">
            <button class="btn secondary" id="shareBtn" type="button">Tampilan untuk dibagikan</button>
        </div>
    </main>

    <nav class="tabs" aria-label="Menu"><div class="in">
        <a href="user-dashboard.html"><svg class="ico" viewBox="0 0 24 24"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg>Beranda</a>
        <a href="gamelist.html"><svg class="ico" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3M15.5 11.5h.01M18 14h.01"/></svg>Game</a>
        <a href="leaderboard.html" class="on" aria-current="page"><svg class="ico" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8"/></svg>Peringkat</a>
    </div></nav>

    <!-- Kartu siap dibagikan -->
    <div class="overlay" id="shareOverlay" hidden>
        <div class="poster-frame" id="posterFrame">
            <div class="poster" id="poster"></div>
        </div>
        <p class="hint">Bisa langsung di-screenshot, atau unduh sebagai gambar (1080×1350).</p>
        <div class="share-actions">
            <button class="btn" id="downloadBtn" type="button">Unduh gambar</button>
            <button class="btn secondary" id="closeShare" type="button">Tutup</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
        import {
            firebaseConfig, ADMIN_EMAIL, LEVELS, levelLabel, escapeHtml,
            weekKeyFor, previousWeekKey, weekEndMs, weekRangeLabel, shortName, weeklyPoints
        } from "./ec-common.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const $ = (id) => document.getElementById(id);

        const TOP_N = 10;
        // scope: 'all' = semua jenjang, 'level' = jenjang sendiri (siswa).
        // boardLevel: null = semua jenjang, atau kode jenjang (mis. 'SMP').
        const state = { uid: null, isAdmin: false, level: null, scope: 'all', boardLevel: null, week: 'this', ranking: [] };
        const pref = {
            get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
            set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* abaikan */ } },
        };
        const weekKey = () => state.week === 'this' ? weekKeyFor() : previousWeekKey(weekKeyFor());

        // ---------- Login ----------
        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'index.html'; return; }
            if (state.uid) return;
            state.uid = user.uid;
            state.isAdmin = user.email === ADMIN_EMAIL;

            if (state.isAdmin) {
                // Admin: tombol kembali ke admin, tanpa navigasi siswa
                $('backLink').hidden = false;
                $('logoMark').hidden = true;
                document.querySelector('nav.tabs').remove();
                document.body.classList.remove('has-tabs');
                $('levelSelect').innerHTML = '<option value="ALL">Semua jenjang</option>'
                    + LEVELS.map((l) => `<option value="${l.value}">Jenjang ${l.label}</option>`).join('');
                const saved = pref.get('lbBoard');
                state.boardLevel = LEVELS.some((l) => l.value === saved) ? saved : null;
                $('levelSelect').value = state.boardLevel || 'ALL';
                $('levelSelect').hidden = false;
            } else {
                try {
                    const snap = await getDoc(doc(db, 'users', user.uid));
                    if (!snap.exists()) { window.location.href = 'user-dashboard.html'; return; }
                    state.level = snap.data().level || null;
                } catch (e) {
                    console.error(e);
                }
                $('scopeLevelBtn').textContent = state.level ? `Jenjang ${levelLabel(state.level)}` : 'Jenjangku';
                state.scope = pref.get('lbScope') === 'level' && state.level ? 'level' : 'all';
                setScope(state.scope);
                $('scopeSeg').hidden = false;
            }
            document.body.style.visibility = 'visible';
            load();
        });

        // ---------- Kontrol ----------
        document.querySelectorAll('#weekSeg button').forEach((b) => b.addEventListener('click', () => {
            document.querySelectorAll('#weekSeg button').forEach((x) => x.classList.toggle('active', x === b));
            state.week = b.dataset.week;
            load();
        }));
        function setScope(scope) {
            state.scope = scope;
            state.boardLevel = scope === 'level' ? state.level : null;
            document.querySelectorAll('#scopeSeg button').forEach((x) => x.classList.toggle('active', x.dataset.scope === scope));
        }
        document.querySelectorAll('#scopeSeg button').forEach((b) => b.addEventListener('click', () => {
            setScope(b.dataset.scope);
            pref.set('lbScope', b.dataset.scope);
            load();
        }));
        $('levelSelect').addEventListener('change', (e) => {
            state.boardLevel = e.target.value === 'ALL' ? null : e.target.value;
            pref.set('lbBoard', e.target.value);
            load();
        });
        const boardLabel = () => state.boardLevel ? `Jenjang ${levelLabel(state.boardLevel)}` : 'Semua Jenjang';

        // ---------- Data ----------
        // Poin: hanya paket soal guru, hasil terbaik per paket (lihat weeklyPoints di ec-common.js)
        function buildRanking(docs) {
            const list = weeklyPoints(docs.map((d) => d.data())).filter((r) => r.points > 0)
                .sort((a, b) => b.points - a.points || b.packs - a.packs || shortName(a.name).localeCompare(shortName(b.name), 'id'));
            // Poin sama = peringkat sama (1, 2, 2, 4, ...)
            list.forEach((r, i) => { r.rank = i > 0 && r.points === list[i - 1].points ? list[i - 1].rank : i + 1; });
            return list;
        }

        async function load() {
            const key = weekKey();
            renderMeta(key);
            $('myRank').innerHTML = '';
            $('podium').innerHTML = '';
            if (!state.isAdmin && state.scope === 'level' && !state.level) {
                $('list').innerHTML = `<li class="empty-state">Jenjangmu belum diatur. Minta guru/admin mengatur jenjangmu, atau lihat papan Semua Jenjang.</li>`;
                state.ranking = [];
                return;
            }
            $('list').innerHTML = '<li class="empty-state">Memuat peringkat...</li>';
            try {
                const filters = state.boardLevel
                    ? [where('level', '==', state.boardLevel), where('week', '==', key)]
                    : [where('week', '==', key)];
                const snap = await getDocs(query(collection(db, 'gameScores'), ...filters));
                state.ranking = buildRanking(snap.docs);
                render();
            } catch (e) {
                console.error(e);
                $('list').innerHTML = `<li class="empty-state">Gagal memuat peringkat: ${escapeHtml(e.message)}</li>`;
            }
        }

        // Kartu minggu: tanggal, sisa waktu, dan 7 kotak hari (Senin-Minggu)
        function renderMeta(key) {
            const isThis = state.week === 'this';
            const end = weekEndMs(key);
            const start = end - 7 * 864e5;
            $('weekLbl').textContent = isThis ? 'Minggu ini' : 'Minggu lalu';
            $('weekRange').textContent = weekRangeLabel(key);
            let done = 7, part = 0;
            if (isThis) {
                const ms = Math.max(0, end - Date.now());
                const d = Math.floor(ms / 864e5), h = Math.floor((ms % 864e5) / 36e5), m = Math.floor((ms % 36e5) / 6e4);
                $('leftLbl').textContent = 'Reset dalam';
                $('weekLeft').textContent = d > 0 ? `${d} hari ${h} jam` : `${h} jam ${m} menit`;
                const elapsed = Math.min(7, Math.max(0, (Date.now() - start) / 864e5));
                done = Math.floor(elapsed);
                part = elapsed - done;
            } else {
                $('leftLbl').textContent = 'Status';
                $('weekLeft').textContent = 'Selesai';
            }
            const days = ['S', 'S', 'R', 'K', 'J', 'S', 'M'];
            $('weekBar').innerHTML = days.map((dn, i) => {
                const fill = i < done ? 100 : i === done ? Math.round(part * 100) : 0;
                return `<div class="day${i === done && isThis ? ' today' : ''}"><span class="wseg"><i style="width:${fill}%"></i></span><span class="dn">${dn}</span></div>`;
            }).join('');
        }
        $('ruleBtn').addEventListener('click', () => {
            const open = $('rule').hidden;
            $('rule').hidden = !open;
            $('ruleBtn').classList.toggle('on', open);
            $('ruleBtn').setAttribute('aria-expanded', String(open));
        });

        // ---------- Tampilan ----------
        // Nama di papan peringkat & poster: kapital semua agar seragam
        const NAME = (r) => shortName(r.name).toUpperCase();
        const medal = (rank) => ({ 1: '🥇', 2: '🥈', 3: '🥉' }[rank] || '');

        function render() {
            const list = state.ranking;
            const isThis = state.week === 'this';
            const me = list.find((r) => r.uid === state.uid);

            // Kartu posisi saya (khusus siswa)
            if (!state.isAdmin) {
                if (!me) {
                    $('myRank').innerHTML = `<div class="my-rank empty"><div class="txt"><small class="kicker">Peringkatmu</small>${isThis
                        ? '<b class="pts">Belum ada poin</b><span class="hint">Mainkan paket soal dari guru untuk masuk papan peringkat.</span><a class="btn block" href="gamelist.html" style="margin-top:12px">Main sekarang</a>'
                        : '<b class="pts">Tidak bermain</b><span class="hint">Ayo kejar peringkat di minggu ini.</span>'}</div></div>`;
                } else {
                    // Target: orang tepat di atasku (atau masuk 10 besar)
                    const above = list.filter((r) => r.points > me.points).pop();
                    let chase = '';
                    if (!isThis) {
                        chase = `<div class="chase done">${me.rank === 1 ? 'Juara minggu lalu. Selamat!' : 'Peringkat akhir minggu lalu.'}</div>`;
                    } else if (me.rank === 1) {
                        chase = `<div class="chase done">${list.length > 1 ? 'Juara sementara. Pertahankan!' : 'Satu-satunya yang punya poin. Pertahankan!'}</div>`;
                    } else {
                        const target = me.rank > TOP_N ? list[TOP_N - 1].points + 1 : above.points + 1;
                        const need = target - me.points;
                        const label = me.rank > TOP_N ? 'masuk 10 besar' : `menyalip <b>${escapeHtml(shortName(above.name).toUpperCase())}</b>`;
                        chase = `<div class="chase"><div class="chase-top"><span><b>${need} poin lagi</b> ${label}</span><span class="num">${me.points}/${target}</span></div>
                            <div class="cbar"><i style="width:${Math.max(4, Math.round((me.points / target) * 100))}%"></i></div></div>`;
                    }
                    $('myRank').innerHTML = `<div class="my-rank"><div class="head"><div class="big">#${me.rank}</div>
                        <div class="txt"><small class="kicker">Peringkatmu</small><b class="pts">${me.points} poin</b>
                        <div class="pills"><span class="pill">${me.packs} paket</span><span class="pill">dari ${list.length} siswa</span></div></div></div>${chase}</div>`;
                }
            }

            if (list.length === 0) {
                $('podium').innerHTML = '';
                $('list').innerHTML = `<li class="empty-state">${isThis ? 'Belum ada poin minggu ini. Jadilah yang pertama!' : 'Tidak ada yang bermain minggu lalu di papan ini.'}</li>`;
                return;
            }

            // Podium: urutan tampil 2 - 1 - 3
            const top = list.slice(0, 3);
            const showLevel = !state.boardLevel;
            const lvTag = (r) => showLevel && r.level ? `<span class="lb-tag">${escapeHtml(levelLabel(r.level))}</span>` : '';
            const lvText = (r) => showLevel && r.level ? `${escapeHtml(levelLabel(r.level))} · ` : '';
            const pod = (r, cls) => r
                ? `<div class="pod ${cls}${r.uid === state.uid ? ' me' : ''}"><div class="medal">${medal(r.rank)}</div><div class="name">${escapeHtml(NAME(r))}</div>${lvTag(r) ? `<div class="lv">${lvTag(r)}</div>` : ''}<div class="pts">${r.points} poin</div><div class="block r${Math.min(r.rank, 3)}">${r.rank}</div></div>`
                : `<div class="pod ${cls} blank"></div>`;
            $('podium').innerHTML = pod(top[1], 'p2') + pod(top[0], 'p1') + pod(top[2], 'p3');

            // Daftar peringkat 4-10 (+ posisi saya jika di luar 10 besar)
            const row = (r) => `<li class="row${r.uid === state.uid ? ' me' : ''}"><span class="rank">${medal(r.rank) || r.rank}</span><span class="who">${escapeHtml(NAME(r))}${r.uid === state.uid ? ' <em>(kamu)</em>' : ''}<small>${lvText(r)}${r.packs} paket</small></span><span class="pts">${r.points} poin</span></li>`;
            let html = list.slice(3, TOP_N).map(row).join('');
            if (me && list.indexOf(me) >= TOP_N) html += `<li class="gap">• • •</li>${row(me)}`;
            $('list').innerHTML = html;
        }

        // ---------- Kartu siap dibagikan ----------
        function posterHtml() {
            const list = state.ranking;
            const isThis = state.week === 'this';
            const top = list.slice(0, 3);
            const p = (r, cls) => r
                ? `<div class="ppod ${cls}"><div class="m">${medal(r.rank)}</div><div class="n">${escapeHtml(NAME(r))}</div><div class="p">${r.points} poin${!state.boardLevel && r.level ? ` · <span class="lv">${escapeHtml(levelLabel(r.level))}</span>` : ''}</div><div class="b r${Math.min(r.rank, 3)}">${r.rank}</div></div>`
                : `<div class="ppod ${cls} blank"></div>`;
            // Peringkat 4-10: jenjang di depan nama
            const rest = list.slice(3, TOP_N).map((r) => `<div class="prow"><span class="r">${medal(r.rank) || r.rank}</span><span class="n">${!state.boardLevel && r.level ? `<span class="lv">${escapeHtml(levelLabel(r.level))}</span>` : ''}${escapeHtml(NAME(r))}</span><span class="p">${r.points} poin</span></div>`).join('');
            return `
                <div class="ptop"><span class="brand">ExtraCourse</span><span class="date">${weekRangeLabel(weekKey())}</span></div>
                <div class="kicker">${isThis ? 'Klasemen sementara' : 'Hasil akhir'}</div>
                <div class="title">${isThis ? 'Top 10 Minggu Ini' : 'Juara Minggu Ini'}</div>
                <div class="sub"><b>${escapeHtml(boardLabel())}</b></div>
                ${list.length ? `<div class="ppodium">${p(top[1], 'p2')}${p(top[0], 'p1')}${p(top[2], 'p3')}</div>` : ''}
                <div class="plist">${rest || (list.length ? `<div class="pempty">${isThis ? 'Masih ada waktu untuk masuk 10 besar!' : 'Selamat untuk para juara!'}</div>` : '<div class="pempty">Belum ada poin di minggu ini.<br>Siapa yang jadi juara pertama?</div>')}</div>
                <div class="foot"><b>${isThis ? 'Ayo kejar peringkatmu!' : 'Selamat, para juara!'}</b></div>`;
        }

        function fitPoster() {
            const scale = Math.min(1, (window.innerWidth - 32) / 540, (window.innerHeight - 170) / 675);
            const frame = $('posterFrame');
            frame.style.width = `${540 * scale}px`;
            frame.style.height = `${675 * scale}px`;
            $('poster').style.transform = `scale(${scale})`;
        }

        $('shareBtn').addEventListener('click', () => {
            $('poster').innerHTML = posterHtml();
            $('shareOverlay').hidden = false;
            fitPoster();
        });
        $('closeShare').addEventListener('click', () => { $('shareOverlay').hidden = true; });
        window.addEventListener('resize', () => { if (!$('shareOverlay').hidden) fitPoster(); });

        // Render kartu ke gambar PNG 1080x1350 (salinan tanpa skala agar tajam)
        async function posterBlob() {
            if (!window.html2canvas) throw new Error('Pembuat gambar belum termuat. Coba lagi, atau screenshot saja.');
            const clone = $('poster').cloneNode(true);
            clone.removeAttribute('id');
            clone.style.cssText = 'position:fixed;left:-10000px;top:0;transform:none;';
            document.body.appendChild(clone);
            try {
                if (document.fonts?.ready) await document.fonts.ready;
                const canvas = await window.html2canvas(clone, { scale: 2, backgroundColor: null, useCORS: true, logging: false });
                return await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
            } finally {
                clone.remove();
            }
        }
        const fileName = () => `peringkat-${state.boardLevel || 'semua-jenjang'}-${weekKey()}.png`.toLowerCase();

        $('downloadBtn').addEventListener('click', async (e) => {
            e.target.disabled = true;
            try {
                const blob = await posterBlob();
                const url = URL.createObjectURL(blob);
                const a = Object.assign(document.createElement('a'), { href: url, download: fileName() });
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 5000);
            } catch (err) {
                alert(err.message);
            } finally {
                e.target.disabled = false;
            }
        });

    </script>
    <script type="module" src="notifications.js"></script>
</body>
</html>
