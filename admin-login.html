<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Admin Login - ExtraCourse</title>
    <link rel="stylesheet" href="game-ui.css">
    <style>
        .auth { width: 100%; max-width: 420px; margin: 0 auto; padding: 40px 16px 24px; display: grid; gap: 16px; }
        .auth-head { display: flex; align-items: center; gap: 12px; }
        .auth-head .logo { width: 46px; height: 46px; border-radius: 13px; font-size: 17px; }
        .auth-head h1 { margin: 0; font-size: 21px; line-height: 1.2; }
        .auth-head p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
        form { display: grid; gap: 14px; }
        .msg { padding: 10px 14px; border-radius: var(--radius-sm); font-size: 14px; }
        .msg.ok { background: var(--ok-soft); color: var(--ok); }
        .msg.error { background: var(--bad-soft); color: var(--bad); }
        .msg.info { background: var(--warn-soft); color: var(--warn); }
        .back-link { justify-self: center; color: var(--muted); font-size: 13px; text-decoration: none; padding: 8px; }
    </style>
</head>
<body>
    <main class="auth">
        <div class="auth-head">
            <span class="logo">EC</span>
            <div><h1>Login Admin</h1><p>Special ExtraCourse</p></div>
        </div>
        <div class="card">
            <form id="adminLoginForm">
                <div id="messageBox" class="msg hidden"></div>
                <label class="field" for="email">Email
                    <input type="email" id="email" class="input" placeholder="admin@extracourse.com" autocomplete="username" required>
                </label>
                <label class="field" for="password">Password
                    <input type="password" id="password" class="input" placeholder="Password" autocomplete="current-password" required>
                </label>
                <button type="submit" class="btn block">Masuk</button>
            </form>
        </div>
        <a href="index.html" class="back-link">Kembali ke halaman siswa</a>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

        // Konfigurasi Firebase Anda
        // Pastikan Anda mengganti placeholder ini dengan konfigurasi proyek Firebase Anda yang sebenarnya.
        const firebaseConfig = {
            apiKey: "AIzaSyA-EoipgOVg9prfbYJ5VoYjA8rqk-RDW5U",
            authDomain: "extra-course-d02c2.firebaseapp.com",
            databaseURL: "https://extra-course-d02c2-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "extra-course-d02c2",
            storageBucket: "extra-course-d02c2.firebasestorage.app",
            messagingSenderId: "40624772967",
            appId: "1:40624772967:web:d022eb7b2c2f4785a641c2",
            measurementId: "G-YNRJKV8T45"
        };

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // DOM Elements
        const adminLoginForm = document.getElementById('adminLoginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const messageBox = document.getElementById('messageBox');

        // Fungsi untuk menampilkan pesan
        function showMessageBox(message, type = 'info') {
            messageBox.textContent = message;
            messageBox.className = 'msg ' + (type === 'success' ? 'ok' : type === 'error' ? 'error' : 'info');
            clearTimeout(messageBox._t);
            messageBox._t = setTimeout(() => { messageBox.className = 'msg hidden'; }, 3000);
        }

        // Event listener untuk form login
        adminLoginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value;
            const password = passwordInput.value;

            try {
                // Melakukan sign-in dengan email dan password
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Verifikasi apakah email yang login adalah admin yang terotorisasi
                const authorizedAdminEmail = "admin@extracourse.com"; // GANTI DENGAN EMAIL ADMIN ANDA YANG SEBENARNYA!

                if (user.email === authorizedAdminEmail) {
                    showMessageBox("Login berhasil! Mengarahkan ke dashboard...", 'success');
                    // Redirect ke dashboard admin setelah login berhasil
                    setTimeout(() => {
                        window.location.href = "admin.html";
                    }, 1500);
                } else {
                    // Jika email bukan admin yang terotorisasi, logout dan tampilkan pesan error
                    await auth.signOut();
                    showMessageBox("Akses ditolak. Anda bukan admin yang terotorisasi.", 'error');
                }
            } catch (error) {
                console.error("Error saat login:", error);
                let errorMessage = "Terjadi kesalahan saat login.";
                if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                    errorMessage = "Email atau password salah.";
                } else if (error.code === 'auth/too-many-requests') {
                    errorMessage = "Terlalu banyak percobaan login yang gagal. Silakan coba lagi nanti.";
                }
                showMessageBox(errorMessage, 'error');
            }
        });
    </script>
</body>
</html>
