<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hafalan Tanpa Salah - ExtraCourse</title>
    <link rel="stylesheet" href="game-ui.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner wide">
            <a href="gamelist.html">← Game</a>
            <h1>Hafalan Tanpa Salah</h1>
        </div>
    </header>

    <main class="app wide">
        <!-- ===== Persiapan ===== -->
        <section id="setup" class="setup-grid">
            <div class="card">
                <h2>Pilih soal</h2>
                <div id="source"></div>
            </div>
            <div class="stack side">
                <div class="card" id="preview"></div>
                <div class="card">
                    <div id="settings"></div>
                    <p class="note" style="margin-top:12px">Sekali salah, hafalan diulang dari kata pertama.</p>
                    <div id="setupMsg" class="feedback bad"></div>
                    <button type="button" class="btn block" id="startBtn" style="margin-top:16px">Mulai</button>
                </div>
            </div>
        </section>

        <!-- ===== Bermain ===== -->
        <section id="play" class="card narrow" hidden>
            <div class="play-head">
                <span class="badge" id="progressBadge">1 / 1</span>
                <span style="display:flex;gap:8px">
                    <span class="badge" id="mistakeBadge">0 salah</span>
                    <span class="badge" id="timer" hidden>00:00</span>
                </span>
            </div>
            <div class="progress"><span id="bar"></span></div>
            <p class="prompt-label" id="promptLabel">Arti dari</p>
            <p class="prompt-word" id="promptWord"></p>
            <form class="answer-row" id="answerForm" autocomplete="off">
                <input class="input" id="answer" placeholder="Jawabanmu" autocapitalize="none" spellcheck="false">
                <button class="btn" type="submit">Periksa</button>
            </form>
            <div id="feedback" class="feedback"></div>
            <div class="actions" style="margin-top:16px">
                <button type="button" class="btn secondary" id="restartBtn">Ulang dari awal</button>
                <button type="button" class="btn secondary" id="backBtn">Ganti soal</button>
            </div>
        </section>

        <!-- ===== Selesai ===== -->
        <section id="done" class="stack narrow" hidden>
            <div class="card result">
                <div class="big" id="doneTitle">Tuntas</div>
                <p class="sub" id="doneSub"></p>
                <div class="actions" style="margin-top:16px">
                    <button type="button" class="btn" id="againBtn">Main lagi</button>
                    <button type="button" class="btn secondary" id="doneBackBtn">Ganti soal</button>
                </div>
            </div>
            <div class="card">
                <h2 id="doneListTitle">Daftar kata</h2>
                <table class="word-table"><tbody id="doneList"></tbody></table>
            </div>
        </section>
    </main>

    <script type="module">
        import { mountWordSource, mountPlaySettings, isAnswerCorrect, shuffled, formatClock } from "./word-source.js";
        import { escapeHtml } from "./ec-common.js";

        const $ = (id) => document.getElementById(id);

        // Pindahkan kata sendiri dari versi lama game ini (sekali saja)
        try {
            const old = JSON.parse(localStorage.getItem("hafalanVocab"));
            if (old?.vocab?.length && !localStorage.getItem("ec-k5")) {
                localStorage.setItem("ec-k5", JSON.stringify({
                    mode: "own",
                    own: old.vocab.filter((v) => v.word && v.meaning).map((v) => ({ q: v.word, a: v.meaning })),
                }));
            }
        } catch { /* abaikan */ }

        let settings = null;
        const source = mountWordSource($("source"), {
            gameKey: "k5",
            maxOwn: 10,
            previewEl: $("preview"),
            onChange: () => { $("setupMsg").textContent = ""; settings?.refresh(); },
        });
        settings = mountPlaySettings($("settings"), {
            gameKey: "k5", secondsPerWord: 15, timerDefault: false,
            count: () => source.words().length,
        });

        let baseWords = [];
        let words = [];
        let index = 0;
        let mistakes = 0;
        let reverse = false;
        let shuffle = false;
        let limit = null;      // detik, null = tanpa batas waktu
        let secondsLeft = 0;
        let timerId = null;
        let running = false;

        function show(section) {
            ["setup", "play", "done"].forEach((id) => { $(id).hidden = id !== section; });
            window.scrollTo(0, 0);
        }

        function start() {
            const problem = source.problem();
            if (problem) { $("setupMsg").textContent = problem; return; }
            const s = settings.get();
            baseWords = source.words();
            reverse = s.reverse;
            shuffle = s.shuffle;
            limit = s.seconds;
            begin(null);
        }

        // Mulai sesi baru (urutan diacak ulang setiap sesi jika "Acak" aktif)
        function begin(message) {
            words = shuffle ? shuffled(baseWords) : [...baseWords];
            mistakes = 0;
            index = 0;
            running = true;
            $("feedback").className = message ? "feedback info" : "feedback";
            $("feedback").textContent = message || "";
            show("play");
            startTimer();
            renderQuestion();
        }

        function startTimer() {
            clearInterval(timerId);
            $("timer").hidden = limit === null;
            if (limit === null) return;
            secondsLeft = limit;
            renderTimer();
            timerId = setInterval(() => {
                secondsLeft--;
                renderTimer();
                if (secondsLeft <= 0) timeUp();
            }, 1000);
        }

        function renderTimer() {
            $("timer").textContent = formatClock(secondsLeft);
            $("timer").className = "badge" + (secondsLeft <= 30 ? " bad" : secondsLeft <= 60 ? " warn" : "");
        }

        function renderQuestion() {
            const w = words[index];
            $("progressBadge").textContent = `${index + 1} / ${words.length}`;
            $("mistakeBadge").textContent = `${mistakes} salah`;
            $("mistakeBadge").className = "badge" + (mistakes ? " bad" : "");
            $("bar").style.width = `${(index / words.length) * 100}%`;
            $("promptLabel").textContent = reverse ? "Kata untuk arti" : "Arti dari";
            $("promptWord").textContent = reverse ? w.a : w.q;
            $("answer").value = "";
            $("answer").focus();
        }

        function check(e) {
            e.preventDefault();
            if (!running) return;
            const input = $("answer").value;
            if (!input.trim()) return;
            const w = words[index];
            const key = reverse ? w.q : w.a;
            if (isAnswerCorrect(input, key)) {
                index++;
                $("feedback").className = "feedback ok";
                $("feedback").textContent = "Benar.";
                if (index >= words.length) finish();
                else renderQuestion();
            } else {
                mistakes++;
                index = 0;
                $("feedback").className = "feedback bad";
                $("feedback").textContent = `Salah. Jawabannya: ${key}. Mulai lagi dari kata pertama.`;
                renderQuestion();
            }
        }

        function showList() {
            $("doneListTitle").textContent = source.title();
            $("doneList").innerHTML = words.map((w, i) =>
                `<tr><td>${i + 1}</td><td>${escapeHtml(w.q)}</td><td>${escapeHtml(w.a)}</td></tr>`).join("");
        }

        function finish() {
            running = false;
            clearInterval(timerId);
            $("doneTitle").textContent = "Tuntas";
            $("doneSub").textContent = `${words.length} kata · ${mistakes ? `${mistakes} kali salah sebelum tuntas` : "tanpa salah"}`;
            showList();
            show("done");
            // Tuntas = semua kata benar berurutan. "points" = jumlah salah sebelum tuntas.
            window.saveGameScore?.({
                gameId: "kosakata-5", gameName: "Hafalan Tanpa Salah",
                correct: words.length, total: words.length, points: mistakes, mode: reverse ? "arti-ke-kata" : "kata-ke-arti",
                ...source.scoreInfo(),
            });
        }

        // Waktu habis sebelum tuntas: tidak ada skor tersimpan
        function timeUp() {
            if (!running) return;
            running = false;
            clearInterval(timerId);
            $("doneTitle").textContent = "Waktu habis";
            $("doneSub").textContent = `Sampai kata ${index + 1} dari ${words.length}. Belum tuntas, skor tidak tersimpan.`;
            showList();
            show("done");
        }

        $("startBtn").addEventListener("click", start);
        $("answerForm").addEventListener("submit", check);
        $("restartBtn").addEventListener("click", () => begin("Dimulai lagi dari kata pertama."));
        $("againBtn").addEventListener("click", () => begin(null));
        $("backBtn").addEventListener("click", () => { running = false; clearInterval(timerId); show("setup"); });
        $("doneBackBtn").addEventListener("click", () => show("setup"));
    </script>
</body>
</html>
