<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Susun Kalimat - ExtraCourse</title>
    <link rel="stylesheet" href="game-ui.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner wide">
            <a href="gamelist.html">← Game</a>
            <h1>Susun Kalimat</h1>
        </div>
    </header>

    <main class="app wide">
        <!-- ===== Persiapan ===== -->
        <section id="setup" class="setup-grid">
            <div class="card">
                <h2>Pilih soal</h2>
                <div id="source"></div>
            </div>
            <div class="stack side">
                <div class="card" id="preview"></div>
                <div class="card">
                    <div id="settings"></div>
                    <div id="setupMsg" class="feedback bad"></div>
                    <button type="button" class="btn block" id="startBtn" style="margin-top:16px">Mulai</button>
                </div>
            </div>
        </section>

        <!-- ===== Bermain ===== -->
        <section id="play" class="card narrow" hidden>
            <div class="play-head">
                <span class="badge" id="progressBadge">1 / 1</span>
                <span class="badge" id="timer" hidden>00:00</span>
            </div>
            <div class="progress"><span id="bar"></span></div>
            <div class="sentence-box" id="answerBox"></div>
            <div class="tile-pool" id="pool"></div>
            <div id="feedback" class="feedback"></div>
            <div class="actions" style="margin-top:16px">
                <button type="button" class="btn secondary" id="clearBtn">Kosongkan</button>
                <button type="button" class="btn" id="actionBtn">Periksa</button>
            </div>
        </section>

        <!-- ===== Hasil ===== -->
        <section id="done" class="stack narrow" hidden>
            <div class="card result">
                <div class="big" id="doneScore">0/0</div>
                <p class="sub" id="doneSub"></p>
                <div class="actions" style="margin-top:16px">
                    <button type="button" class="btn" id="againBtn">Main lagi</button>
                    <button type="button" class="btn secondary" id="doneBackBtn">Ganti soal</button>
                </div>
            </div>
            <div class="card" id="missedCard">
                <h2>Perlu diulang</h2>
                <div id="missedList"></div>
            </div>
        </section>
    </main>

    <script type="module">
        import { mountWordSource, mountPlaySettings, shuffled, formatClock, wordTableHtml, PACK_FIELDS, normalizeAnswer } from "./word-source.js";
        import { escapeHtml } from "./ec-common.js";

        const $ = (id) => document.getElementById(id);

        let settings = null;
        const source = mountWordSource($("source"), {
            gameKey: "scr",
            type: "kalimat",
            maxOwn: 30,
            previewEl: $("preview"),
            onChange: () => { $("setupMsg").textContent = ""; settings?.refresh(); },
        });
        settings = mountPlaySettings($("settings"), {
            gameKey: "scr", secondsPerWord: 25, timerDefault: true,
            count: () => source.words().length,
            directions: null,
        });

        let sentences = [];
        let index = 0;
        let correct = 0;
        let missed = [];
        let parts = null;      // { words, end } kalimat sekarang
        let tiles = [];        // kata acak: [{ text, used }]
        let picked = [];       // urutan susunan siswa (indeks tiles)
        let checked = false;
        let limit = null;      // detik, null = tanpa batas waktu
        let secondsLeft = 0;
        let timerId = null;
        let finished = true;

        function show(section) {
            ["setup", "play", "done"].forEach((id) => { $(id).hidden = id !== section; });
            window.scrollTo(0, 0);
        }

        // Pisahkan kalimat menjadi kata. Tanda baca akhir (. ? !) tidak ikut
        // diacak, tetapi selalu tampil di ujung kalimat.
        function splitSentence(text) {
            const words = String(text).trim().split(/\s+/);
            let end = "";
            const last = words[words.length - 1];
            const m = last.match(/[.?!]+$/);
            if (m) {
                end = m[0];
                const rest = last.slice(0, -end.length);
                if (rest) words[words.length - 1] = rest; else words.pop();
            }
            return { words, end };
        }

        // Acak kata, usahakan tidak sama dengan urutan aslinya
        function scrambleWords(words) {
            let out = shuffled(words);
            for (let i = 0; i < 10 && words.length > 1 && out.join(" ") === words.join(" "); i++) out = shuffled(words);
            return out;
        }

        function start() {
            const problem = source.problem();
            if (problem) { $("setupMsg").textContent = problem; return; }
            const s = settings.get();
            const list = source.words();
            sentences = s.shuffle ? shuffled(list) : list;
            limit = s.seconds;
            index = 0;
            correct = 0;
            missed = [];
            finished = false;
            show("play");
            startTimer();
            renderQuestion();
        }

        function startTimer() {
            clearInterval(timerId);
            $("timer").hidden = limit === null;
            if (limit === null) return;
            secondsLeft = limit;
            renderTimer();
            timerId = setInterval(() => {
                secondsLeft--;
                renderTimer();
                if (secondsLeft <= 0) finish(true);
            }, 1000);
        }

        function renderTimer() {
            $("timer").textContent = formatClock(secondsLeft);
            $("timer").className = "badge" + (secondsLeft <= 30 ? " bad" : secondsLeft <= 60 ? " warn" : "");
        }

        function renderQuestion() {
            parts = splitSentence(sentences[index].text);
            tiles = scrambleWords(parts.words).map((text) => ({ text, used: false }));
            picked = [];
            checked = false;
            $("progressBadge").textContent = `${index + 1} / ${sentences.length}`;
            $("bar").style.width = `${(index / sentences.length) * 100}%`;
            $("feedback").className = "feedback";
            $("feedback").textContent = "";
            $("answerBox").className = "sentence-box";
            $("actionBtn").textContent = "Periksa";
            renderTiles();
        }

        function renderTiles() {
            const box = $("answerBox");
            box.classList.toggle("filled", picked.length > 0);
            const placed = picked.map((t, i) => `<button type="button" class="tile" data-placed="${i}"${checked ? " disabled" : ""}>${escapeHtml(tiles[t].text)}</button>`);
            // Tanda baca akhir menempel pada kata terakhir agar tidak turun sendirian
            if (placed.length && parts.end) placed.push(`<span class="last">${placed.pop()}<span class="end">${escapeHtml(parts.end)}</span></span>`);
            box.innerHTML = placed.length ? placed.join("") : '<span class="placeholder">Ketuk kata di bawah sesuai urutan.</span>';
            $("pool").innerHTML = tiles.map((t, i) =>
                `<button type="button" class="tile${t.used ? " used" : ""}" data-tile="${i}"${t.used || checked ? " disabled" : ""}>${escapeHtml(t.text)}</button>`).join("");
            $("clearBtn").disabled = checked || picked.length === 0;
            $("actionBtn").disabled = !checked && picked.length < tiles.length;
        }

        function check() {
            const answer = picked.map((t) => tiles[t].text).join(" ");
            const ok = normalizeAnswer(answer) === normalizeAnswer(parts.words.join(" "));
            checked = true;
            if (ok) correct++;
            else missed.push(sentences[index]);
            renderTiles();
            $("answerBox").classList.add(ok ? "is-ok" : "is-bad");
            $("feedback").className = "feedback " + (ok ? "ok" : "bad");
            $("feedback").textContent = ok ? "Benar." : `Jawaban: ${sentences[index].text}`;
            $("actionBtn").textContent = index + 1 < sentences.length ? "Berikutnya" : "Lihat hasil";
            $("actionBtn").focus();
        }

        function next() {
            index++;
            if (index >= sentences.length) finish(false);
            else renderQuestion();
        }

        function finish(timeUp) {
            if (finished) return;
            finished = true;
            clearInterval(timerId);
            // Saat waktu habis, kalimat yang belum diperiksa dihitung perlu diulang
            if (timeUp) missed.push(...sentences.slice(checked ? index + 1 : index));
            $("doneScore").textContent = `${correct}/${sentences.length}`;
            $("doneSub").textContent = `benar${timeUp ? " · waktu habis" : ""}`;
            $("missedCard").hidden = missed.length === 0;
            $("missedList").innerHTML = wordTableHtml(missed, PACK_FIELDS.kalimat);
            show("done");
            window.saveGameScore?.({
                gameId: "scramble", gameName: "Susun Kalimat",
                correct, total: sentences.length, mode: "susun-kata",
                ...source.scoreInfo(),
            });
        }

        // Ketuk kata di bawah: pindah ke susunan. Ketuk kata di susunan: kembalikan.
        $("pool").addEventListener("click", (e) => {
            const btn = e.target.closest("[data-tile]");
            if (!btn || checked) return;
            const i = Number(btn.dataset.tile);
            if (tiles[i].used) return;
            tiles[i].used = true;
            picked.push(i);
            renderTiles();
        });
        $("answerBox").addEventListener("click", (e) => {
            const btn = e.target.closest("[data-placed]");
            if (!btn || checked) return;
            const [t] = picked.splice(Number(btn.dataset.placed), 1);
            tiles[t].used = false;
            renderTiles();
        });
        $("clearBtn").addEventListener("click", () => {
            if (checked) return;
            tiles.forEach((t) => { t.used = false; });
            picked = [];
            renderTiles();
        });
        $("actionBtn").addEventListener("click", () => {
            if (finished) return;
            if (checked) next(); else check();
        });

        $("startBtn").addEventListener("click", start);
        $("againBtn").addEventListener("click", start);
        $("doneBackBtn").addEventListener("click", () => show("setup"));
    </script>
</body>
</html>
