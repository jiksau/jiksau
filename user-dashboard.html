<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Beranda - ExtraCourse</title>
    <link rel="stylesheet" href="game-ui.css">
    <style>
        body { visibility: hidden; } /* tampil setelah status login diketahui */

        /* Peringkat minggu ini: lencana lingkaran + angka poin */
        .week-rank {
            display: grid; grid-template-columns: 1fr 1fr 24px; align-items: stretch;
            background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
            box-shadow: var(--shadow); color: var(--text); text-decoration: none; overflow: hidden;
        }
        .week-rank.two { grid-template-columns: 1fr 1fr 1fr 24px; }
        .week-rank:active { transform: scale(0.99); }
        .week-rank .cell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 14px 4px 12px; text-align: center; border-left: 1px solid var(--line); min-width: 0; }
        .week-rank .cell:first-child { border-left: 0; }
        .week-rank .cell > span { font-size: 11.5px; color: var(--muted); font-weight: 600; line-height: 1.25; }
        .ring { width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--accent) var(--p), var(--soft) 0); }
        .ring > div { width: 54px; height: 54px; border-radius: 50%; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
        .ring b { font-size: 19px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
        .ring small { font-size: 9.5px; font-weight: 700; color: var(--muted); margin-top: 3px; }
        .week-rank .num { background: var(--accent-soft); }
        .week-rank .num b { font-size: 30px; line-height: 66px; height: 66px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
        .week-rank .go { display: grid; place-items: center; color: var(--accent); background: var(--accent-soft); padding-right: 6px; }
        .week-rank.empty { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 14px 14px 14px 16px; }
        .week-rank.empty .go { background: none; padding: 0; }
        .week-rank .kicker { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
        .week-rank .pts { display: block; font-size: 18px; line-height: 1.3; }
        .week-rank .hint { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }

        /* Paket minggu ini: berapa yang sudah poin penuh */
        .pack-week { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 14px 14px 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); color: var(--text); text-decoration: none; }
        .pack-week .kicker { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
        .pack-week b { display: block; font-size: 16px; line-height: 1.35; margin-top: 2px; }
        .pack-week .bar { height: 6px; margin: 8px 0 6px; border-radius: 99px; background: var(--soft); overflow: hidden; }
        .pack-week .bar span { display: block; height: 100%; border-radius: 99px; background: var(--ok); }
        .pack-week .hint { display: block; font-size: 13px; color: var(--muted); }
        .pack-week .go { color: var(--muted); display: grid; place-items: center; }

        /* Tier */
        .tier-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 14px 14px 10px; }
        .pet-row { display: grid; grid-template-columns: 112px 1fr; gap: 10px; align-items: center; }
        .pet-stage { border: 0; padding: 0; background: radial-gradient(circle 50px at 50% 53%, var(--accent-soft) 0 49px, transparent 50px); border-radius: 16px; cursor: pointer; line-height: 0; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px 0 7px; border-radius: 99px; background: var(--soft); color: var(--text); font-size: 13.5px; font-weight: 700; text-decoration: none; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .chip .tier-badge { flex: none; }
        .chip .up { padding: 1px 7px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-size: 10.5px; }
        .chip.shop { padding-left: 8px; }
        .chip.shop b { margin-left: 2px; padding-left: 8px; border-left: 1px solid var(--line-strong); color: var(--accent); font-weight: 700; }
        .xp-row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
        .xp-row b { color: var(--text); font-size: 14px; }
        .xp-row button { border: 0; background: none; padding: 0; color: var(--accent); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
        .pet-stage svg { animation: petIdle 3.2s ease-in-out infinite; transform-origin: 50% 90%; }
        .pet-stage.hop svg { animation: petHop .5s ease-out, petIdle 3.2s ease-in-out .5s infinite; }
        @keyframes petIdle { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-2px) scale(1.015, .985); } }
        @keyframes petHop { 0% { transform: translateY(0); } 35% { transform: translateY(-14px) scale(.97, 1.04); } 70% { transform: translateY(0) scale(1.05, .95); } 100% { transform: none; } }
        @media (prefers-reduced-motion: reduce) { .pet-stage svg { animation: none !important; } }
        .pet-info { min-width: 0; }
        .pet-name { display: block; font-size: 19px; line-height: 1.25; overflow-wrap: anywhere; }
        .pet-sub { display: block; font-size: 13px; color: var(--muted); margin-top: 1px; }
        .pet-stages { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; text-align: center; padding-bottom: 8px; margin-bottom: 6px; border-bottom: 1px solid var(--line); }
        .pet-stages div { display: grid; justify-items: center; font-size: 11px; color: var(--muted); font-weight: 600; }
        .pet-stages .locked svg { opacity: .35; }
        .pet-stages .cur span { color: var(--accent); font-weight: 700; }
        .ladder .link { border: 0; background: none; padding: 4px 0 8px; color: var(--accent); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
        .pet-overlay { position: fixed; inset: 0; z-index: 2100; background: rgba(10,16,13,.5); display: flex; align-items: center; justify-content: center; padding: 20px; }
        .pet-dialog { width: 100%; max-width: 420px; background: var(--surface); border-radius: 20px; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
        .pet-dialog h3 { margin: 0; font-size: 19px; }
        .pet-dialog p { margin: 4px 0 14px; color: var(--muted); font-size: 13.5px; }
        .pet-dialog label { display: block; font-weight: 600; font-size: 13.5px; margin: 14px 0 6px; }
        .pet-choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .pet-choices button { display: grid; justify-items: center; gap: 2px; padding: 8px 4px 10px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--text); }
        .pet-choices button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
        .pet-dialog .form-msg { min-height: 18px; margin-top: 6px; color: var(--bad); font-size: 13px; }
        .pet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
        .tier-bar { height: 8px; border-radius: 99px; background: var(--soft); margin-top: 6px; overflow: hidden; }
        .tier-bar i { display: block; height: 100%; border-radius: 99px; }
        .tier-next { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; font-size: 12.5px; color: var(--muted); }
        .tier-next button { border: 0; background: none; padding: 0; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; }
        .ladder { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
        .ladder .lr { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 4px 0; font-size: 13.5px; }
        .ladder .lr.cur { font-weight: 700; }
        .ladder .lr.locked { opacity: .5; }
        .ladder .lr span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
        .ladder p { margin: 8px 0 0; font-size: 12.5px; color: var(--muted); }

        /* Nilai terbaik & riwayat */
        .rows { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
        .rows .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
        .rows .row:first-child { border-top: 0; }
        .rows:empty { display: none; }
        .rows > .empty { border: 0; border-radius: 0; box-shadow: none; }
        .rows .nm { font-weight: 600; min-width: 0; }
        .pct { font-weight: 700; font-variant-numeric: tabular-nums; }
        .hist { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
        .hist:first-child { border-top: 0; }
        .hist .m { min-width: 0; }
        .hist .nm { font-weight: 700; }
        .hist .ds { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
        .hist .res { text-align: right; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .hist .res small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
        .score-good { color: var(--ok); }
        .score-mid { color: var(--warn); }
        .score-low { color: var(--bad); }

        /* Akun */
        .kv { display: grid; gap: 0; margin: 0; }
        .kv div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
        .kv div:first-child { border-top: 0; padding-top: 0; }
        .kv dt { color: var(--muted); }
        .kv dd { margin: 0; font-weight: 600; text-align: right; overflow-wrap: anywhere; min-width: 0; }
    </style>
</head>
<body class="has-tabs">
    <header class="topbar">
        <div class="topbar-inner">
            <a class="logo" href="user-dashboard.html" aria-label="Ke Beranda">EC</a>
            <div class="brand"><b>Halo, <span id="greetName">Siswa</span>!</b><small id="headSub">&nbsp;</small></div>
            <span id="notif"></span>
        </div>
    </header>

    <main class="app">
        <div id="tierCard" class="tier-card" hidden></div>
        <a id="weekRank" class="week-rank" href="leaderboard.html" hidden></a>
        <a id="packWeek" class="pack-week" href="gamelist.html" hidden></a>

        <a class="btn block" href="gamelist.html">Main game</a>

        <div id="gameStats" class="stats"></div>

        <div class="sec" id="bestSec" hidden>Nilai terbaik</div>
        <div id="gameBestList" class="rows"></div>

        <div class="sec">Latihan terakhir</div>
        <div id="gameHistoryList" class="rows">
            <div class="empty">Memuat...</div>
        </div>

        <div class="sec">Akun</div>
        <div class="card">
            <dl class="kv">
                <div><dt>Nama</dt><dd id="userName">Memuat...</dd></div>
                <div><dt>Jenjang</dt><dd id="userLevel">-</dd></div>
                <div><dt id="loginLabel">Email</dt><dd id="userLogin">-</dd></div>
                <div><dt>Terakhir masuk</dt><dd id="lastLoginAt">-</dd></div>
            </dl>
            <button class="btn secondary block" id="logoutButton" style="margin-top:14px">Keluar</button>
        </div>
    </main>

    <nav class="tabs" aria-label="Menu"><div class="in">
        <a href="user-dashboard.html" class="on" aria-current="page"><svg class="ico" viewBox="0 0 24 24"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg>Beranda</a>
        <a href="gamelist.html"><svg class="ico" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3M15.5 11.5h.01M18 14h.01"/></svg>Game</a>
        <a href="leaderboard.html"><svg class="ico" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8"/></svg>Peringkat</a>
    </div></nav>

    <script type="module" src="notifications.js"></script>
    <script type="module" src="announcements.js"></script>
    <script type="module" src="recap.js"></script>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getFirestore, setDoc, doc, getDoc, getDocs, collection, query, where, onSnapshot, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
        import "./game-scores.js"; // window.loadQuestionPacks & loadWeekPackPoints
        import { firebaseConfig, ADMIN_EMAIL, levelLabel, usernameFromEmail, escapeHtml, weekKeyFor, weeklyPoints, packMaxPoints } from "./ec-common.js";
        import { loadHistory } from "./weekly-results.js";
        import { TIERS, tierFor, xpByUser, tierBadge, coinsEarned, COIN_ICON } from "./tiers.js";
        import { PET_SPECIES, PET_NAME_MAX, STAGES, stageForTier, nextStageTier, petSvg, speciesOf, itemById, publicPet } from "./pets.js";
        // Salin hewan ke pets/{uid} (dibaca papan peringkat) jika belum sama
        async function syncPublicPet() {
            const pub = publicPet(myPet, myEquipped);
            if (!pub || !myUid) return;
            try {
                const snap = await getDoc(doc(db, 'pets', myUid));
                if (snap.exists() && JSON.stringify(snap.data()) === JSON.stringify(pub)) return;
                await setDoc(doc(db, 'pets', myUid), pub);
            } catch (e) { console.warn('Gagal menyalin hewan:', e); }
        }
        let myPet = null, myUid = null, tierRender = null, myItems = [], myEquipped = {};

        const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const $ = (id) => document.getElementById(id);

        let started = false;
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html"; // Belum login → ke halaman masuk
                return;
            }
            if (user.email === ADMIN_EMAIL) {
                window.location.href = "admin.html";
                return;
            }
            if (started) return;
            started = true;

            const username = usernameFromEmail(user.email);
            $('loginLabel').textContent = username ? 'Nama pengguna' : 'Email';
            $('userLogin').textContent = username || user.email;

            try {
                const userRef = doc(db, "users", user.uid);
                const snap = await getDoc(userRef);
                if (snap.exists()) {
                    const data = snap.data();
                    myPet = data.pet || null;
                    myItems = Array.isArray(data.items) ? data.items : [];
                    myEquipped = data.equipped || {};
                    syncPublicPet();
                    myUid = user.uid;
                    $('userName').textContent = data.name || '-';
                    $('greetName').textContent = (data.name || 'Siswa').split(' ')[0];
                    $('userLevel').textContent = levelLabel(data.level);
                    $('headSub').textContent = [levelLabel(data.level), username || user.email].filter(Boolean).join(' · ');
                    $('lastLoginAt').textContent = data.lastLoginAt
                        ? data.lastLoginAt.toDate().toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' })
                        : 'Ini pertama kalinya';
                    await updateDoc(userRef, { lastLoginAt: serverTimestamp() });
                    loadWeekRank(user.uid, data.level || null);
                    loadPackWeek();
                } else {
                    // Profil sudah dihapus admin: hapus juga akun loginnya
                    // agar email/nama pengguna bisa dipakai lagi.
                    await handleDeletedAccount(user);
                    return;
                }
            } catch (error) {
                console.error("Error loading profile:", error);
                $('userName').textContent = 'Gagal memuat profil.';
            }

            loadGameScores(user.uid);
            document.body.style.visibility = 'visible';
        });

        async function handleDeletedAccount(user) {
            document.body.style.visibility = 'visible';
            document.querySelector('main').innerHTML = `
                <div class="card">
                    <h2>Akun tidak aktif</h2>
                    <p class="note" style="margin-bottom:8px">Akun ini sudah dihapus oleh admin ExtraCourse.</p>
                    <p class="note">Jika menurutmu ini keliru, hubungi guru atau admin untuk dibuatkan akun baru.</p>
                    <button class="btn block" id="backHome" style="margin-top:16px">Kembali ke halaman depan</button>
                </div>`;
            document.querySelector('nav.tabs')?.remove();
            document.getElementById('backHome').addEventListener('click', () => { window.location.href = 'index.html'; });
            try {
                await user.delete();
            } catch (e) {
                // Mis. sesi login sudah terlalu lama; cukup keluar saja.
                console.warn('Gagal menghapus akun login:', e);
                await signOut(auth);
            }
        }

        $('logoutButton').addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = "index.html";
        });

        // Ringkasan peringkat minggu ini: semua jenjang + jenjang sendiri
        // (detail di leaderboard.html)
        async function loadWeekRank(uid, level) {
            try {
                const snap = await getDocs(query(collection(db, "gameScores"), where("week", "==", weekKeyFor())));
                // Hanya paket soal guru, hasil terbaik per paket (sama dengan papan peringkat)
                const scores = snap.docs.map((d) => d.data());
                renderTier(uid, weeklyPoints(scores));
                const toMap = (list) => Object.fromEntries(weeklyPoints(list).map((r) => [r.uid, r.points]));
                const all = toMap(scores);
                const same = level ? toMap(scores.filter((s) => s.level === level)) : {};
                const rankOf = (map) => {
                    const mine = map[uid] || 0;
                    const players = Object.values(map).filter((p) => p > 0);
                    return { mine, total: players.length, rank: 1 + players.filter((p) => p > mine).length };
                };
                const g = rankOf(all);
                const box = $('weekRank');
                if (g.mine > 0) {
                    // Lencana lingkaran: makin dekat ke juara 1, makin penuh
                    const ring = (r, label) => {
                        const fill = r.total <= 1 ? 100 : Math.max(6, Math.round(((r.total - r.rank) / (r.total - 1)) * 100));
                        return `<div class="cell"><div class="ring" style="--p:${fill}%"><div><b>#${r.rank}</b><small>dari ${r.total}</small></div></div><span>${label}</span></div>`;
                    };
                    box.innerHTML = `${ring(g, 'Semua jenjang')}${level ? ring(rankOf(same), `Jenjang ${escapeHtml(levelLabel(level))}`) : ''}
                        <div class="cell num"><b>${g.mine}</b><span>Poin</span></div>
                        <span class="go">${CHEV}</span>`;
                    box.classList.toggle('two', !!level);
                } else {
                    box.classList.add('empty');
                    box.innerHTML = `<div class="txt"><small class="kicker">Peringkat minggu ini</small><b class="pts">Belum ada poin</b><small class="hint">Mainkan paket soal dari guru untuk masuk peringkat.</small></div><span class="go">${CHEV}</span>`;
                }
                box.hidden = false;
            } catch (e) {
                console.warn("Gagal memuat peringkat:", e);
            }
        }

        // Paket minggu ini: berapa paket yang sudah poin penuh, sisa poin yang bisa didapat
        async function loadPackWeek() {
            const [res, best] = await Promise.all([window.loadQuestionPacks(), window.loadWeekPackPoints()]);
            if (res.status !== 'ok' || !res.packs.length) return;
            let full = 0, left = 0;
            res.packs.forEach((p) => {
                const max = packMaxPoints(p), got = Math.min(best.get(p.id) || 0, max);
                if (got >= max) full++;
                left += max - got;
            });
            const n = res.packs.length;
            const box = $('packWeek');
            box.innerHTML = `<div><small class="kicker">Paket minggu ini</small>
                    <b>Poin penuh ${full} dari ${n} paket</b>
                    <div class="bar"><span style="width:${Math.round((full / n) * 100)}%"></span></div>
                    <small class="hint">${full === n
                        ? 'Semua paket sudah poin penuh. Tunggu paket baru, atau main lagi mulai Senin.'
                        : `Masih bisa tambah ${left} poin.`}</small></div>
                <span class="go">${CHEV}</span>`;
            box.hidden = false;
        }

        // Tier: XP = semua poin mingguan sepanjang masa (lihat tiers.js)
        async function renderTier(uid, current) {
            try {
                const weeks = await loadHistory();
                const xp = xpByUser(weeks, current)[uid] || 0;
                const coins = Math.max(0, coinsEarned(weeks, current, uid) - myItems.reduce((s, id) => s + (itemById(id)?.price || 0), 0));
                const t = tierFor(xp);
                // Naik tier sejak terakhir membuka Beranda? (disimpan di browser)
                const KEY = `ec-tier-${uid}`;
                let seen = null;
                try { seen = localStorage.getItem(KEY); localStorage.setItem(KEY, String(t.index)); } catch { /* abaikan */ }
                const up = seen !== null && t.index > Number(seen);
                const box = $('tierCard');
                const stage = stageForTier(t.index);
                const sp = myPet ? speciesOf(myPet.species) : null;
                const grow = nextStageTier(t.index);
                const nextText = !t.next ? 'Tier tertinggi. Luar biasa!'
                    : myPet && grow === t.next.index ? `${t.need.toLocaleString('id-ID')} XP lagi, <b>${escapeHtml(myPet.name)}</b> ${stage === 0 ? 'menetas' : 'tumbuh jadi ' + STAGES[stage + 1]}`
                    : `${t.need.toLocaleString('id-ID')} XP lagi ke <b>${escapeHtml(t.next.label)}</b>`;
                box.innerHTML = `
                    <div class="pet-row">
                        <button type="button" class="pet-stage" id="petBtn" aria-label="${myPet ? 'Sapa ' + escapeHtml(myPet.name) : 'Pilih hewan'}">${petSvg(myPet?.species || 'kucing', myPet ? stage : 0, 112, 'pet-svg', myPet ? myEquipped : {})}</button>
                        <div class="pet-info">${myPet
                            ? `<b class="pet-name">${escapeHtml(myPet.name)}</b><span class="pet-sub">${escapeHtml(sp.name)} · ${STAGES[stage]}</span>`
                            : `<b class="pet-name">Telur misterius</b><span class="pet-sub">Pilih hewan peliharaanmu. Ia akan tumbuh setiap kamu naik tier.</span><button type="button" class="btn" id="petPick" style="margin-top:10px;height:40px">Pilih hewan</button>`}
                            <div class="chips">
                                <span class="chip">${tierBadge(t, 22)}<span>${escapeHtml(t.label)}</span>${up ? '<span class="up">Naik!</span>' : ''}</span>
                                ${myPet ? `<a class="chip shop" href="toko.html" aria-label="Toko, ${coins} koin">${COIN_ICON}<span>${coins.toLocaleString('id-ID')}</span><b>Toko</b></a>` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="xp-row"><b>${xp.toLocaleString('id-ID')} XP</b><button type="button" id="ladderBtn" aria-expanded="false">Semua tier</button></div>
                    <div class="tier-bar"><i style="width:${Math.max(2, Math.round(t.progress * 100))}%;background:linear-gradient(90deg, ${t.light}, ${t.color})"></i></div>
                    <div class="tier-next"><span>${nextText}</span></div>
                    <div class="ladder" id="ladder" hidden>
                        ${myPet ? `<div class="pet-stages">${[1, 2, 3, 4, 5].map((st) => `<div class="${st > stage ? 'locked' : ''}${st === stage ? ' cur' : ''}">${petSvg(myPet.species, st > stage ? 0 : st, 48)}<span>${STAGES[st]}</span></div>`).join('')}</div>
                        <button type="button" class="link" id="petEdit">Ubah hewan atau nama</button>` : ''}
                        ${TIERS.slice().reverse().map((x) => `<div class="lr${x.index === t.index ? ' cur' : ''}${x.index > t.index ? ' locked' : ''}">${tierBadge(x, 26)}<span>${escapeHtml(x.label)}</span><span>${x.xp.toLocaleString('id-ID')} XP</span></div>`).join('')}
                        <p>1 poin dari paket soal guru = 1 XP (hasil terbaik per paket tiap minggu; poin per jawaban benar = poin level paket × 2 untuk game menulis, × 1 untuk game memilih). XP tidak berkurang, jadi tier tidak pernah turun.</p>
                    </div>`;
                $('petBtn').addEventListener('click', () => {
                    if (!myPet) return openPetPicker();
                    const b = $('petBtn');
                    b.classList.remove('hop'); void b.offsetWidth; b.classList.add('hop');
                });
                $('petPick')?.addEventListener('click', openPetPicker);
                $('petEdit')?.addEventListener('click', openPetPicker);
                tierRender = () => renderTier(uid, current);
                $('ladderBtn').addEventListener('click', (e) => {
                    const open = $('ladder').hidden;
                    $('ladder').hidden = !open;
                    e.target.setAttribute('aria-expanded', String(open));
                    e.target.textContent = open ? 'Tutup' : 'Semua tier';
                });
                box.hidden = false;
            } catch (e) {
                console.warn('Gagal memuat tier:', e);
            }
        }

        // Pilih / ubah hewan peliharaan (disimpan di users/{uid}.pet)
        function openPetPicker() {
            let chosen = myPet?.species || PET_SPECIES[0].key;
            const ov = document.createElement('div');
            ov.className = 'pet-overlay';
            ov.innerHTML = `<div class="pet-dialog" role="dialog" aria-modal="true" aria-labelledby="petTitle">
                <h3 id="petTitle">${myPet ? 'Ubah hewan peliharaan' : 'Pilih hewan peliharaan'}</h3>
                <p>Hewanmu menetas lalu tumbuh setiap kamu naik tier.</p>
                <div class="pet-choices">${PET_SPECIES.map((s) => `<button type="button" data-sp="${s.key}" class="${s.key === chosen ? 'on' : ''}">${petSvg(s.key, 1, 76)}<span>${s.name}</span></button>`).join('')}</div>
                <label for="petName">Nama</label>
                <input class="input" id="petName" maxlength="${PET_NAME_MAX}" placeholder="Contoh: Mochi" value="${escapeHtml(myPet?.name || '')}">
                <div class="form-msg" id="petMsg"></div>
                <div class="pet-actions"><button type="button" class="btn secondary" id="petCancel">Batal</button><button type="button" class="btn" id="petSave">Simpan</button></div>
            </div>`;
            document.body.appendChild(ov);
            const close = () => ov.remove();
            ov.querySelectorAll('.pet-choices button').forEach((b) => b.addEventListener('click', () => {
                chosen = b.dataset.sp;
                ov.querySelectorAll('.pet-choices button').forEach((x) => x.classList.toggle('on', x === b));
            }));
            ov.querySelector('#petCancel').addEventListener('click', close);
            ov.addEventListener('click', (e) => { if (e.target === ov) close(); });
            ov.querySelector('#petSave').addEventListener('click', async (e) => {
                const name = ov.querySelector('#petName').value.trim().replace(/\s+/g, ' ');
                if (!name) { ov.querySelector('#petMsg').textContent = 'Beri nama hewanmu dulu.'; return; }
                e.target.disabled = true;
                try {
                    const pet = { species: chosen, name: name.slice(0, PET_NAME_MAX) };
                    await updateDoc(doc(db, 'users', myUid), { pet });
                    myPet = pet;
                    syncPublicPet();
                    close();
                    tierRender?.();
                } catch (err) {
                    ov.querySelector('#petMsg').textContent = 'Gagal menyimpan: ' + err.message;
                    e.target.disabled = false;
                }
            });
            ov.querySelector('#petName').focus();
        }

        const CHEV = '<svg class="ico" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>';

        // --- Progres Latihan Game ---
        function scoreColor(percent) {
            if (percent >= 80) return 'score-good';
            if (percent >= 60) return 'score-mid';
            return 'score-low';
        }

        function describeScore(item) {
            if (item.gameId === 'kosakata-5') {
                const mistakes = item.points ?? 0;
                return `Tuntas ${item.total} kata` + (mistakes > 0 ? `<small>${mistakes}x salah sebelumnya</small>` : '<small>tanpa salah</small>');
            }
            return `${item.correct}/${item.total} benar<small>${item.percent}%</small>`;
        }

        function loadGameScores(currentUserId) {
            const statsEl = document.getElementById('gameStats');
            const bestEl = document.getElementById('gameBestList');
            const historyEl = document.getElementById('gameHistoryList');
            // Tanpa orderBy agar tidak perlu membuat index Firestore; diurutkan di browser.
            const q = query(collection(db, "gameScores"), where("userId", "==", currentUserId));

            onSnapshot(q, (snapshot) => {
                const items = snapshot.docs.map((d) => d.data())
                    .sort((a, b) => (b.timestamp?.toMillis?.() ?? Date.now()) - (a.timestamp?.toMillis?.() ?? Date.now()));

                if (items.length === 0) {
                    statsEl.innerHTML = '';
                    bestEl.innerHTML = '';
                    $('bestSec').hidden = true;
                    historyEl.innerHTML = '<div class="empty">Belum ada latihan. Mainkan game di menu Game, hasilnya tersimpan otomatis di sini.</div>';
                    return;
                }

                const weekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
                const thisWeek = items.filter((i) => (i.timestamp?.toMillis?.() ?? Date.now()) >= weekAgo).length;
                const avg = Math.round(items.reduce((sum, i) => sum + (i.percent || 0), 0) / items.length);

                const statCard = (label, value) => `<div class="stat"><b>${value}</b><span>${label}</span></div>`;
                statsEl.innerHTML = statCard('Total latihan', items.length)
                    + statCard('7 hari terakhir', thisWeek)
                    + statCard('Rata-rata nilai', `${avg}%`);

                // Nilai terbaik per game
                const best = {};
                items.forEach((i) => {
                    if (!best[i.gameId] || i.percent > best[i.gameId].percent) best[i.gameId] = i;
                });
                $('bestSec').hidden = false;
                // Hanya 3 game dengan nilai terbaik agar beranda tetap ringkas
                bestEl.innerHTML = Object.values(best).sort((a, b) => b.percent - a.percent).slice(0, 3).map((b) => `
                    <div class="row"><span class="nm">${escapeHtml(b.gameName)}</span><span class="pct ${scoreColor(b.percent)}">${b.percent}%</span></div>`).join('');

                historyEl.innerHTML = items.slice(0, 5).map((i) => {
                    const when = i.timestamp ? i.timestamp.toDate().toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }) : 'Baru saja';
                    return `
                        <div class="hist">
                            <div class="m">
                                <div class="nm">${escapeHtml(i.gameName)}</div>
                                <div class="ds">${i.packId ? escapeHtml(i.packName || '-') : 'Latihan bebas'} · ${when}</div>
                            </div>
                            <div class="res ${scoreColor(i.percent)}">${describeScore(i)}</div>
                        </div>`;
                }).join('');
            }, (error) => {
                console.error("Error fetching game scores:", error);
                historyEl.innerHTML = `<div class="feedback bad">Gagal memuat progres latihan: ${escapeHtml(error.message)}</div>`;
            });
        }
    </script>
</body>
</html>
