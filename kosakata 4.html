<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Kata Kerja V1-V2-V3 - ExtraCourse</title>
    <link rel="stylesheet" href="game-ui.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner wide">
            <a href="gamelist.html" class="back"><svg class="ico" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>Game</a>
            <h1>Kata Kerja V1-V2-V3</h1>
        </div>
    </header>

    <main class="app wide">
        <!-- ===== Persiapan ===== -->
        <section id="setup" class="setup-grid">
            <div class="card">
                <h2>Pilih soal</h2>
                <div id="source"></div>
            </div>
            <div class="stack side">
                <div class="card" id="preview"></div>
                <div class="card">
                    <div id="settings"></div>
                    <p class="note" style="margin-top:12px">Benar jika ketiga bentuk tepat.</p>
                    <div id="setupMsg" class="feedback bad"></div>
                    <button type="button" class="btn block" id="startBtn" style="margin-top:16px">Mulai</button>
                </div>
            </div>
        </section>

        <!-- ===== Bermain ===== -->
        <section id="play" class="card narrow" hidden>
            <div class="play-head">
                <span class="badge" id="progressBadge">1 / 1</span>
                <span class="badge" id="timer" hidden>00:00</span>
            </div>
            <div class="progress"><span id="bar"></span></div>
            <p class="prompt-label" id="promptLabel"></p>
            <p class="prompt-word" id="promptWord"></p>
            <p class="prompt-hint" id="promptHint" hidden></p>
            <form id="answerForm" autocomplete="off">
                <div class="verb-fields">
                    <label class="field">V1
                        <input class="input" id="v1" autocapitalize="none" spellcheck="false">
                        <span class="key" id="key-v1"></span>
                    </label>
                    <label class="field">V2
                        <input class="input" id="v2" autocapitalize="none" spellcheck="false">
                        <span class="key" id="key-v2"></span>
                    </label>
                    <label class="field">V3
                        <input class="input" id="v3" autocapitalize="none" spellcheck="false">
                        <span class="key" id="key-v3"></span>
                    </label>
                </div>
                <div id="feedback" class="feedback"></div>
                <button class="btn block" type="submit" id="actionBtn" style="margin-top:12px">Periksa</button>
            </form>
        </section>

        <!-- ===== Hasil ===== -->
        <section id="done" class="stack narrow" hidden>
            <div class="card result">
                <div class="big" id="doneScore">0/0</div>
                <p class="sub" id="doneSub"></p>
                <div class="actions" style="margin-top:16px">
                    <button type="button" class="btn" id="againBtn">Main lagi</button>
                    <button type="button" class="btn secondary" id="doneBackBtn">Ganti soal</button>
                </div>
            </div>
            <div class="card" id="missedCard">
                <h2>Perlu diulang</h2>
                <div id="missedList"></div>
            </div>
        </section>
    </main>

    <script type="module">
        import { mountWordSource, mountPlaySettings, isAnswerCorrect, shuffled, formatClock, wordTableHtml, PACK_FIELDS } from "./word-source.js";

        const $ = (id) => document.getElementById(id);
        const FORMS = ["v1", "v2", "v3"];

        let settings = null;
        const source = mountWordSource($("source"), {
            gameKey: "k4",
            type: "verb",
            previewEl: $("preview"),
            onChange: () => { $("setupMsg").textContent = ""; settings?.refresh(); },
        });
        settings = mountPlaySettings($("settings"), {
            gameKey: "k4", secondsPerWord: 20, timerDefault: true,
            count: () => source.words().length,
            directions: ["Arti → V1, V2, V3", "V1 → V2, V3"],
        });

        let words = [];
        let index = 0;
        let correct = 0;
        let missed = [];
        let fromV1 = false;    // true = V1 diberikan, isi V2 & V3
        let checked = false;   // soal sekarang sudah diperiksa
        let limit = null;      // detik, null = tanpa batas waktu
        let secondsLeft = 0;
        let timerId = null;
        let finished = false;

        function show(section) {
            ["setup", "play", "done"].forEach((id) => { $(id).hidden = id !== section; });
            window.scrollTo(0, 0);
        }

        function start() {
            const problem = source.problem();
            if (problem) { $("setupMsg").textContent = problem; return; }
            const s = settings.get();
            words = s.shuffle ? shuffled(source.words()) : source.words();
            fromV1 = s.reverse;
            limit = s.seconds;
            index = 0;
            correct = 0;
            missed = [];
            finished = false;
            show("play");
            startTimer();
            renderQuestion();
        }

        function startTimer() {
            clearInterval(timerId);
            $("timer").hidden = limit === null;
            if (limit === null) return;
            secondsLeft = limit;
            renderTimer();
            timerId = setInterval(() => {
                secondsLeft--;
                renderTimer();
                if (secondsLeft <= 0) finish(true);
            }, 1000);
        }

        function renderTimer() {
            $("timer").textContent = formatClock(secondsLeft);
            $("timer").className = "badge" + (secondsLeft <= 30 ? " bad" : secondsLeft <= 60 ? " warn" : "");
        }

        function renderQuestion() {
            const w = words[index];
            checked = false;
            $("progressBadge").textContent = `${index + 1} / ${words.length}`;
            $("bar").style.width = `${(index / words.length) * 100}%`;
            $("promptLabel").textContent = fromV1 ? "Tulis V2 dan V3 dari" : "Tulis V1, V2, V3 dari";
            $("promptWord").textContent = fromV1 ? w.v1 : w.arti;
            $("promptHint").textContent = w.arti;
            $("promptHint").hidden = !fromV1;
            FORMS.forEach((f) => {
                const input = $(f);
                input.value = fromV1 && f === "v1" ? w.v1 : "";
                input.disabled = fromV1 && f === "v1";
                input.className = "input";
                $(`key-${f}`).textContent = "";
            });
            $("feedback").textContent = "";
            $("feedback").className = "feedback";
            $("actionBtn").textContent = "Periksa";
            $(fromV1 ? "v2" : "v1").focus();
        }

        function check() {
            const w = words[index];
            const asked = fromV1 ? ["v2", "v3"] : FORMS;
            if (asked.every((f) => !$(f).value.trim())) { $(asked[0]).focus(); return; }
            let allOk = true;
            asked.forEach((f) => {
                const ok = isAnswerCorrect($(f).value, w[f]);
                if (!ok) { allOk = false; $(`key-${f}`).textContent = w[f]; }
                $(f).className = "input " + (ok ? "is-ok" : "is-bad");
            });
            FORMS.forEach((f) => { $(f).disabled = true; });
            if (allOk) correct++;
            else missed.push(w);
            $("feedback").className = "feedback " + (allOk ? "ok" : "bad");
            $("feedback").textContent = allOk ? "Benar." : `Jawaban: ${w.v1}, ${w.v2}, ${w.v3}`;
            checked = true;
            $("actionBtn").textContent = index + 1 < words.length ? "Berikutnya" : "Lihat hasil";
            $("actionBtn").focus();
        }

        function next() {
            index++;
            if (index >= words.length) finish(false);
            else renderQuestion();
        }

        function finish(timeUp) {
            if (finished) return;
            finished = true;
            clearInterval(timerId);
            // Saat waktu habis, soal yang belum diperiksa dihitung perlu diulang
            if (timeUp) missed.push(...words.slice(checked ? index + 1 : index));
            $("doneScore").textContent = `${correct}/${words.length}`;
            $("doneSub").textContent = `benar${timeUp ? " · waktu habis" : ""}`;
            $("missedCard").hidden = missed.length === 0;
            $("missedList").innerHTML = wordTableHtml(missed, PACK_FIELDS.verb);
            show("done");
            window.saveGameScore?.({
                gameId: "kosakata-4", gameName: "Kata Kerja V1-V2-V3",
                correct, total: words.length, mode: fromV1 ? "v1-ke-v2v3" : "arti-ke-v123",
                ...source.scoreInfo(),
            });
        }

        $("startBtn").addEventListener("click", start);
        $("againBtn").addEventListener("click", start);
        $("doneBackBtn").addEventListener("click", () => show("setup"));
        $("answerForm").addEventListener("submit", (e) => {
            e.preventDefault();
            if (finished) return;
            if (checked) next(); else check();
        });
        // Enter di V1/V2 pindah ke kolom berikutnya; di V3 memeriksa jawaban
        ["v1", "v2"].forEach((f, i) => $(f).addEventListener("keydown", (e) => {
            if (e.key !== "Enter") return;
            e.preventDefault();
            $(FORMS[i + 1]).focus();
        }));
    </script>
</body>
</html>
