<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Kosakata - ExtraCourse</title>
    <link rel="stylesheet" href="game-ui.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner wide">
            <a href="gamelist.html">← Game</a>
            <h1>Kuis Kosakata</h1>
        </div>
    </header>

    <main class="app wide">
        <!-- ===== Persiapan ===== -->
        <section id="setup" class="setup-grid">
            <div class="card">
                <h2>Pilih soal</h2>
                <div id="source"></div>
            </div>
            <div class="stack side">
                <div class="card" id="preview"></div>
                <div class="card">
                    <div id="settings"></div>
                    <div id="setupMsg" class="feedback bad"></div>
                    <button type="button" class="btn block" id="startBtn" style="margin-top:16px">Mulai</button>
                </div>
            </div>
        </section>

        <!-- ===== Bermain ===== -->
        <section id="play" class="stack narrow" hidden>
            <div class="card result" id="resultCard" hidden>
                <div class="big" id="resultScore">0/0</div>
                <p class="sub" id="resultSub"></p>
                <div class="actions" style="margin-top:16px">
                    <button type="button" class="btn" id="againBtn">Main lagi</button>
                    <button type="button" class="btn secondary" id="backBtn">Ganti soal</button>
                </div>
            </div>
            <div class="card">
                <div class="play-head">
                    <span class="badge" id="answeredBadge">0 / 0</span>
                    <span class="badge" id="timer" hidden>00:00</span>
                </div>
                <div class="progress"><span id="bar"></span></div>
                <div class="quiz-list" id="quizList"></div>
                <div class="actions" style="margin-top:16px" id="playActions">
                    <button type="button" class="btn secondary" id="pauseBtn">Jeda</button>
                    <button type="button" class="btn" id="submitBtn">Periksa</button>
                </div>
            </div>
        </section>
    </main>

    <script type="module">
        import { mountWordSource, mountPlaySettings, isAnswerCorrect, shuffled, formatClock } from "./word-source.js";
        import { escapeHtml } from "./ec-common.js";

        const $ = (id) => document.getElementById(id);

        let settings = null;
        const source = mountWordSource($("source"), {
            gameKey: "k2",
            previewEl: $("preview"),
            onChange: () => { $("setupMsg").textContent = ""; settings?.refresh(); },
        });
        settings = mountPlaySettings($("settings"), {
            gameKey: "k2", secondsPerWord: 8, timerDefault: true,
            count: () => source.words().length,
        });

        let words = [];
        let reverse = false;
        let timerId = null;
        let limit = null;      // detik, null = tanpa batas waktu
        let secondsLeft = 0;
        let paused = false;
        let submitted = false;

        const inputs = () => [...document.querySelectorAll("#quizList input")];

        function show(section) {
            ["setup", "play"].forEach((id) => { $(id).hidden = id !== section; });
            window.scrollTo(0, 0);
        }

        function start() {
            const problem = source.problem();
            if (problem) { $("setupMsg").textContent = problem; return; }
            const s = settings.get();
            words = s.shuffle ? shuffled(source.words()) : source.words();
            reverse = s.reverse;
            limit = s.seconds;
            paused = false;
            submitted = false;

            $("quizList").innerHTML = words.map((w, i) => `
                <div class="quiz-item">
                    <label class="q" for="ans-${i}">${escapeHtml(reverse ? w.a : w.q)}</label>
                    <input class="input" id="ans-${i}" data-i="${i}" placeholder="${reverse ? "Kata" : "Arti"}" autocomplete="off" autocapitalize="none" spellcheck="false">
                    <div class="key" id="key-${i}" hidden></div>
                </div>`).join("");
            $("resultCard").hidden = true;
            $("playActions").hidden = false;
            $("pauseBtn").textContent = "Jeda";
            $("pauseBtn").hidden = limit === null; // jeda hanya berguna jika ada batas waktu
            updateAnswered();
            show("play");
            startTimer();
            inputs()[0]?.focus();
        }

        function startTimer() {
            clearInterval(timerId);
            $("timer").hidden = limit === null;
            if (limit === null) return;
            secondsLeft = limit;
            renderTimer();
            timerId = setInterval(() => {
                if (paused) return;
                secondsLeft--;
                renderTimer();
                if (secondsLeft <= 0) submit(true);
            }, 1000);
        }

        function renderTimer() {
            $("timer").textContent = formatClock(secondsLeft);
            $("timer").className = "badge" + (secondsLeft <= 30 ? " bad" : secondsLeft <= 60 ? " warn" : "");
        }

        function updateAnswered() {
            const done = inputs().filter((i) => i.value.trim()).length;
            $("answeredBadge").textContent = `${done} / ${words.length} terjawab`;
            $("bar").style.width = `${words.length ? (done / words.length) * 100 : 0}%`;
        }

        function togglePause() {
            if (submitted) return;
            paused = !paused;
            $("pauseBtn").textContent = paused ? "Lanjut" : "Jeda";
            // Selama jeda, isian dikunci agar waktu tetap adil
            inputs().forEach((i) => { i.disabled = paused; });
            if (!paused) inputs().find((i) => !i.value.trim())?.focus();
        }

        function submit(timeUp = false) {
            if (submitted) return;
            submitted = true;
            clearInterval(timerId);
            let correct = 0;
            words.forEach((w, i) => {
                const input = $(`ans-${i}`);
                const key = reverse ? w.q : w.a;
                const ok = isAnswerCorrect(input.value, key);
                if (ok) correct++;
                input.disabled = true;
                input.className = "input " + (ok ? "is-ok" : "is-bad");
                if (!ok) {
                    $(`key-${i}`).textContent = `Jawaban: ${key}`;
                    $(`key-${i}`).hidden = false;
                }
            });
            $("playActions").hidden = true;
            $("resultScore").textContent = `${correct}/${words.length}`;
            $("resultSub").textContent = `benar · ${Math.round((correct / words.length) * 100)}%${timeUp ? " · waktu habis" : ""}`;
            $("resultCard").hidden = false;
            window.scrollTo(0, 0);
            window.saveGameScore?.({
                gameId: "kosakata-2", gameName: "Kuis Kosakata",
                correct, total: words.length, mode: reverse ? "arti-ke-kata" : "kata-ke-arti",
                ...source.scoreInfo(),
            });
        }

        $("startBtn").addEventListener("click", start);
        $("againBtn").addEventListener("click", start);
        $("backBtn").addEventListener("click", () => show("setup"));
        $("pauseBtn").addEventListener("click", togglePause);
        $("submitBtn").addEventListener("click", () => submit(false));
        $("quizList").addEventListener("input", updateAnswered);
        // Enter = pindah ke soal berikutnya
        $("quizList").addEventListener("keydown", (e) => {
            if (e.key !== "Enter" || !e.target.matches("input")) return;
            e.preventDefault();
            const list = inputs();
            const next = list[list.indexOf(e.target) + 1];
            if (next) next.focus();
            else $("submitBtn").focus();
        });
    </script>
</body>
</html>
