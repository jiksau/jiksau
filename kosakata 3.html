<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Hafalan - ExtraCourse</title>
    <link rel="stylesheet" href="game-ui.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a href="gamelist.html">← Game</a>
            <h1>Kartu Hafalan</h1>
        </div>
    </header>

    <main class="app">
        <!-- ===== Persiapan ===== -->
        <section id="setup" class="stack">
            <div class="card">
                <h2>Pilih soal</h2>
                <div id="source"></div>
            </div>
            <div class="card">
                <div class="settings">
                    <label class="field wide">Arah soal
                        <select id="direction" class="input">
                            <option value="qa">Kata → Arti</option>
                            <option value="aq">Arti → Kata</option>
                        </select>
                    </label>
                    <label class="field">Waktu (menit)
                        <input type="number" id="minutes" class="input" min="1" max="30" value="3" inputmode="numeric">
                    </label>
                    <label class="check"><input type="checkbox" id="shuffle"> Acak urutan</label>
                </div>
                <p class="note" style="margin-top:12px">Tiap kata punya 3 kesempatan menjawab.</p>
                <div id="setupMsg" class="feedback bad"></div>
                <button type="button" class="btn block" id="startBtn" style="margin-top:16px">Mulai</button>
            </div>
        </section>

        <!-- ===== Bermain ===== -->
        <section id="play" class="card" hidden>
            <div class="play-head">
                <span class="badge" id="progressBadge">1 / 1</span>
                <span class="badge" id="timer">00:00</span>
            </div>
            <div class="progress"><span id="bar"></span></div>
            <p class="prompt-label" id="promptLabel">Arti dari</p>
            <p class="prompt-word" id="promptWord"></p>
            <form class="answer-row" id="answerForm" autocomplete="off">
                <input class="input" id="answer" placeholder="Jawabanmu" autocapitalize="none" spellcheck="false">
                <button class="btn" type="submit" id="checkBtn">Periksa</button>
            </form>
            <div id="feedback" class="feedback"></div>
            <div class="actions" style="margin-top:16px">
                <button type="button" class="btn secondary" id="skipBtn">Lewati</button>
                <button type="button" class="btn" id="nextBtn" disabled>Berikutnya</button>
            </div>
        </section>

        <!-- ===== Hasil ===== -->
        <section id="done" class="stack" hidden>
            <div class="card result">
                <div class="big" id="doneScore">0/0</div>
                <p class="sub" id="doneSub"></p>
                <div class="actions" style="margin-top:16px">
                    <button type="button" class="btn" id="againBtn">Main lagi</button>
                    <button type="button" class="btn secondary" id="doneBackBtn">Ganti soal</button>
                </div>
            </div>
            <div class="card" id="missedCard">
                <h2>Perlu diulang</h2>
                <table class="word-table"><tbody id="missedList"></tbody></table>
            </div>
        </section>
    </main>

    <script type="module">
        import { mountWordSource, isAnswerCorrect, shuffled } from "./word-source.js";
        import { escapeHtml } from "./ec-common.js";

        const $ = (id) => document.getElementById(id);
        const MAX_TRIES = 3;

        const source = mountWordSource($("source"), {
            gameKey: "k3",
            onChange: () => { $("setupMsg").textContent = ""; },
        });

        let words = [];
        let index = 0;
        let tries = 0;
        let correct = 0;
        let resolved = false;   // kata sekarang sudah benar / kesempatan habis
        let missed = [];
        let reverse = false;
        let timerId = null;
        let secondsLeft = 0;
        let finished = false;

        function show(section) {
            ["setup", "play", "done"].forEach((id) => { $(id).hidden = id !== section; });
            window.scrollTo(0, 0);
        }

        function start() {
            const problem = source.problem();
            if (problem) { $("setupMsg").textContent = problem; return; }
            const minutes = Math.min(30, Math.max(1, parseInt($("minutes").value, 10) || 3));
            $("minutes").value = minutes;
            words = $("shuffle").checked ? shuffled(source.words()) : source.words();
            reverse = $("direction").value === "aq";
            index = 0;
            correct = 0;
            missed = [];
            finished = false;
            secondsLeft = minutes * 60;
            show("play");
            startTimer();
            renderCard();
        }

        function startTimer() {
            clearInterval(timerId);
            renderTimer();
            timerId = setInterval(() => {
                secondsLeft--;
                renderTimer();
                if (secondsLeft <= 0) finish(true);
            }, 1000);
        }

        function renderTimer() {
            const s = Math.max(0, secondsLeft);
            $("timer").textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
            $("timer").className = "badge" + (s <= 30 ? " bad" : s <= 60 ? " warn" : "");
        }

        function renderCard() {
            const w = words[index];
            tries = 0;
            resolved = false;
            $("progressBadge").textContent = `${index + 1} / ${words.length}`;
            $("bar").style.width = `${(index / words.length) * 100}%`;
            $("promptLabel").textContent = reverse ? "Kata untuk arti" : "Arti dari";
            $("promptWord").textContent = reverse ? w.a : w.q;
            $("answer").value = "";
            $("answer").disabled = false;
            $("answer").className = "input";
            $("checkBtn").disabled = false;
            $("skipBtn").disabled = false;
            $("nextBtn").disabled = true;
            $("feedback").textContent = "";
            $("feedback").className = "feedback";
            $("answer").focus();
        }

        function keyOf(w) { return reverse ? w.q : w.a; }

        function resolve(isCorrect, message) {
            resolved = true;
            $("answer").disabled = true;
            $("answer").className = "input " + (isCorrect ? "is-ok" : "is-bad");
            $("checkBtn").disabled = true;
            $("skipBtn").disabled = true;
            $("nextBtn").disabled = false;
            $("feedback").className = "feedback " + (isCorrect ? "ok" : "bad");
            $("feedback").textContent = message;
            $("nextBtn").focus();
        }

        function check(e) {
            e.preventDefault();
            if (resolved || finished) return;
            const input = $("answer").value;
            if (!input.trim()) return;
            const w = words[index];
            if (isAnswerCorrect(input, keyOf(w))) {
                correct++;
                resolve(true, "Benar.");
                return;
            }
            tries++;
            if (tries >= MAX_TRIES) {
                missed.push(w);
                resolve(false, `Kesempatan habis. Jawabannya: ${keyOf(w)}`);
            } else {
                $("feedback").className = "feedback bad";
                $("feedback").textContent = `Salah. Sisa ${MAX_TRIES - tries} kesempatan.`;
                $("answer").select();
            }
        }

        function skip() {
            if (resolved || finished) return;
            const w = words[index];
            missed.push(w);
            resolve(false, `Dilewati. Jawabannya: ${keyOf(w)}`);
        }

        function next() {
            if (!resolved || finished) return;
            index++;
            if (index >= words.length) finish(false);
            else renderCard();
        }

        function finish(timeUp) {
            if (finished) return;
            finished = true;
            clearInterval(timerId);
            // Kata yang belum sempat dijawab saat waktu habis dihitung perlu diulang
            const start = resolved ? index + 1 : index;
            if (timeUp) missed.push(...words.slice(start));
            $("doneScore").textContent = `${correct}/${words.length}`;
            $("doneSub").textContent = `benar${timeUp ? " · waktu habis" : ""}`;
            $("missedCard").hidden = missed.length === 0;
            $("missedList").innerHTML = missed.map((w, i) =>
                `<tr><td>${i + 1}</td><td>${escapeHtml(reverse ? w.a : w.q)}</td><td>${escapeHtml(keyOf(w))}</td></tr>`).join("");
            show("done");
            window.saveGameScore?.({
                gameId: "kosakata-3", gameName: "Kartu Hafalan",
                correct, total: words.length, mode: reverse ? "arti-ke-kata" : "kata-ke-arti",
                ...source.scoreInfo(),
            });
        }

        $("startBtn").addEventListener("click", start);
        $("againBtn").addEventListener("click", start);
        $("answerForm").addEventListener("submit", check);
        $("skipBtn").addEventListener("click", skip);
        $("nextBtn").addEventListener("click", next);
        // Enter setelah kata selesai = lanjut
        document.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && resolved && !finished && !$("play").hidden && document.activeElement !== $("nextBtn")) {
                e.preventDefault();
                next();
            }
        });
        $("doneBackBtn").addEventListener("click", () => show("setup"));
    </script>
</body>
</html>
