<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Pertanyaan Acak - ExtraCourse</title>
    <!-- © Extracourse - All rights reserved -->
    <link rel="stylesheet" href="game-ui.css">
    <style>
        .q-box { min-height: 150px; display: grid; place-items: center; text-align: center; padding: 8px; }
        .q-box .q { font-size: 24px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
        .q-box .hint { color: var(--muted); font-size: 14.5px; }
        .q-list { margin: 12px 0 0; padding: 0; list-style: none; max-height: 260px; overflow-y: auto; border-top: 1px solid var(--line); }
        .q-list li { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
        .q-list li:last-child { border-bottom: 0; }
        .q-list .icon-btn { width: 36px; height: 36px; font-size: 1.1rem; }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a href="gamelist.html" class="back"><svg class="ico" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>Game</a>
            <h1>Pertanyaan Acak</h1>
        </div>
    </header>

    <main class="app">
        <section class="card">
            <div class="q-box" id="questionBox"><p class="hint">Tambahkan pertanyaan di bawah, lalu tekan Acak.</p></div>
            <button type="button" class="btn block" id="randomBtn" style="margin-top:12px">Acak pertanyaan</button>
        </section>

        <section class="card">
            <h2>Daftar pertanyaan</h2>
            <form class="answer-row" id="addForm" autocomplete="off">
                <input type="text" class="input" id="userQuestion" placeholder="Tulis pertanyaan" maxlength="200">
                <button type="submit" class="btn">Tambah</button>
            </form>
            <ul class="q-list" id="list"></ul>
            <p class="note" id="count" style="margin-top:10px"></p>
        </section>
    </main>

    <script>
        const KEY = "ec-questions";
        const $ = (id) => document.getElementById(id);
        let questions = [];
        let last = -1;
        try { questions = JSON.parse(localStorage.getItem(KEY)) || []; } catch { questions = []; }

        function save() { try { localStorage.setItem(KEY, JSON.stringify(questions)); } catch { /* abaikan */ } }
        const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

        function renderList() {
            $("list").innerHTML = questions.map((q, i) =>
                `<li><span>${esc(q)}</span><button type="button" class="icon-btn" data-del="${i}" aria-label="Hapus">&times;</button></li>`).join("");
            $("count").textContent = questions.length ? `${questions.length} pertanyaan` : "Belum ada pertanyaan.";
            $("list").hidden = !questions.length;
        }

        // Acak, tetapi tidak sama dengan pertanyaan sebelumnya
        $("randomBtn").addEventListener("click", () => {
            if (!questions.length) {
                $("questionBox").innerHTML = '<p class="hint">Belum ada pertanyaan. Tambahkan dulu di bawah.</p>';
                return;
            }
            let i = Math.floor(Math.random() * questions.length);
            if (questions.length > 1 && i === last) i = (i + 1 + Math.floor(Math.random() * (questions.length - 1))) % questions.length;
            last = i;
            $("questionBox").innerHTML = `<p class="q">${esc(questions[i])}</p>`;
        });

        $("addForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const text = $("userQuestion").value.trim();
            if (!text) return;
            questions.push(text);
            $("userQuestion").value = "";
            save();
            renderList();
        });

        $("list").addEventListener("click", (e) => {
            const b = e.target.closest("[data-del]");
            if (!b) return;
            questions.splice(Number(b.dataset.del), 1);
            last = -1;
            save();
            renderList();
        });

        renderList();
    </script>
</body>
</html>
